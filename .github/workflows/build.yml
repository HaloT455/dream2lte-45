name: Build Dream2LTE Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ems-v2-experimental

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            wget \
            tar \
            xz-utils

      - name: Setup Python
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Setup toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=codex-v7-1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Mon Aug 24 23:40:00 +07 2026" >> "$GITHUB_ENV"

      - name: Check GCC
        run: |
          ${CROSS_COMPILE}gcc --version

      - name: Configure kernel
        run: |
          make O=out exynos8895-dream2lte_defconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^# CONFIG_KSU_LSM_SECURITY_HOOKS is not set$' out/.config
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' out/.config
          grep -q '^CONFIG_EROFS_FS=y$' out/.config
          grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' out/.config

      - name: Build kernel
        run: |
          make O=out -j"$(nproc)" Image dtb.img

      - name: Package kernel
        run: |
          mkdir -p output
          cp -v out/arch/arm64/boot/Image output/
          cp -v out/arch/arm64/boot/dtb.img output/
          cp -v out/System.map output/
          cp -v out/.config output/kernel.config
          sha256sum output/* > output/SHA256SUMS

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-s8plus-kernel-${{ github.sha }}
          path: output/
          if-no-files-found: error
