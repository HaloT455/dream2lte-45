name: Build V9 V6 Rebuild Hardware Stage

on:
  workflow_dispatch:
  push:
    branches:
      - v9haloT45-hw-stage

permissions:
  contents: read

concurrency:
  group: v9-hw-stage-dream2lte-${{ github.ref }}
  cancel-in-progress: true

env:
  AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [enforcing, permissive]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 wget tar xz-utils zip
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-v9-hw" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=2" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Fri Aug 28 12:00:00 UTC 2026" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Enforcing"
          else
            scripts/config --file "$OUT/.config" \
              --enable ALWAYS_PERMISSIVE \
              --enable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Permissive"
          fi
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate integration
        run: |
          OUT="out-${{ matrix.variant }}"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_MINFREE=128$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_TIMEOUT_MSEC=200$' "$OUT/.config"
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' "$OUT/.config"
          grep -q '^CONFIG_MEMCG=y$' "$OUT/.config"
          grep -q '^CONFIG_SWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$OUT/.config"
          grep -q '^CONFIG_F2FS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_EROFS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$OUT/.config"
          grep -q -- '-DKSU_VERSION=32590' drivers/kernelsu/Makefile
          grep -q 'KSU_EXPECTED_SIZE := 0x0363' drivers/kernelsu/Makefile
          grep -q '^unsigned int capacity_margin = 1280;$' kernel/sched/fair.c
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(2500)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(8000)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SIMPLE_DEV_PM_OPS(s3c2410wdt_pm_ops' drivers/watchdog/s3c2410_wdt.c
          grep -q '\.pm.*= &s3c2410wdt_pm_ops' drivers/watchdog/s3c2410_wdt.c
          ! grep -q 'register_syscore_ops(&s3c2410wdt_syscore_ops)' drivers/watchdog/s3c2410_wdt.c
          grep -q 'kthread_bind_mask(thread, cpumask_of(SUGOV_WORKER_CPU))' kernel/sched/cpufreq_schedutil.c
          grep -q 'APOLLO_COOLING_RELEASE_TEMP.*64000' drivers/thermal/samsung/exynos_tmu.c
          grep -A2 'mngs_alert0: mngs-alert0' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -A2 'mngs_alert1: mngs-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '70000'
          grep -A2 'apo_alert1: apo-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -q 'cooling-device = <&cpu0 1 1>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'cooling-device = <&cpu0 11 11>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'max-freq = <2002000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'max-freq = <2704000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'mif,sim_mode = <2>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'static int ds_detect = 2;' drivers/misc/modem_v1/modem_ctrl_ss310ap.c
          grep -q 'of_property_read_u32(np, "mif,sim_mode"' drivers/misc/modem_v1/modem_ctrl_ss310ap.c
          grep -q 'of_property_read_u32(of_node, "mif,sim_mode"' drivers/misc/modem_v1/modem_main.c
          grep -q 'gpu_max_clock = <455000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'gpu_max_clock_limit = <455000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'platform->gpu_max_clock_limit = min_t(int,' drivers/gpu/arm/b_r19p0/platform/exynos/mali_kbase_platform.c
          ! grep -q '^CONFIG_LRU_GEN=y          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
          fi

      - name: Build kernel and DTB
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v9-65c-build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: error

      - name: Validate output
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          DTC="$OUT/scripts/dtc/dtc"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte_eur_open_10.dtb"
          VALIDATED_DTS="$OUT/dream2lte-validated.dts"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          test -x "$DTC"
          test -s "$DTB"
          "$DTC" -I dtb -O dts -o "$VALIDATED_DTS" "$DTB"
          grep -q 'max-freq = <0x1e8c50>;' "$VALIDATED_DTS"
          grep -q 'max-freq = <0x294280>;' "$VALIDATED_DTS"
          grep -q 'mif,sim_mode = <0x2>;' "$VALIDATED_DTS"
          grep -q 'gpu_max_clock = <0x6f158>;' "$VALIDATED_DTS"
          grep -q 'gpu_max_clock_limit = <0x6f158>;' "$VALIDATED_DTS"
          grep -a -q 'simple_lmk: Ready with global vmpressure' "$OUT/arch/arm64/boot/Image"
          strings -a "$OUT/arch/arm64/boot/Image" | grep -x -q '32590'
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -a -q 'Linux version 4.4.302-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Enforcing' "$OUT/arch/arm64/boot/Image"
          else
            grep -a -q 'Linux version 4.4.302-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Permissive' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package flashable V9 hardware stage
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          AK3="anykernel-${{ matrix.variant }}"
          mkdir -p "$DEST"
          git init "$AK3"
          git -C "$AK3" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK3" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK3" checkout --detach FETCH_HEAD
          rm -rf "$AK3/.git" "$AK3/README.md" "$AK3/.github"
          cp packaging/anykernel.sh "$AK3/anykernel.sh"
          cp "$OUT/arch/arm64/boot/Image" "$AK3/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$AK3/dtb"
          (
            cd "$AK3"
            zip -qr9 "../$DEST/ALice-V9-DSDS-GPU455-SLMK-EAS-65C-${{ matrix.variant }}-${GITHUB_SHA::8}.zip" .
          )
          cp "$OUT/arch/arm64/boot/Image" "$DEST/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/dtb.img"
          cp "$OUT/System.map" "$DEST/System.map"
          cp "$OUT/.config" "$DEST/kernel.config"
          (
            cd "$DEST"
            sha256sum ALice-V9-DSDS-GPU455-*.zip Image dtb.img System.map kernel.config > SHA256SUMS
          )

      - name: Upload ${{ matrix.variant }} V9 hardware stage
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v9-hwstage-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
 "$OUT/.config"
          ! grep -q 'lru_gen_' mm/vmscan.c
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
          fi

      - name: Build kernel and DTB
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v9-65c-build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: error

      - name: Validate output
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          DTC="$OUT/scripts/dtc/dtc"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte_eur_open_10.dtb"
          VALIDATED_DTS="$OUT/dream2lte-validated.dts"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          test -x "$DTC"
          test -s "$DTB"
          "$DTC" -I dtb -O dts -o "$VALIDATED_DTS" "$DTB"
          grep -q 'max-freq = <0x1e8c50>;' "$VALIDATED_DTS"
          grep -q 'max-freq = <0x294280>;' "$VALIDATED_DTS"
          grep -a -q 'simple_lmk: Ready with global vmpressure' "$OUT/arch/arm64/boot/Image"
          strings -a "$OUT/arch/arm64/boot/Image" | grep -x -q '32590'
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -a -q 'Linux version 4.4.302-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Enforcing' "$OUT/arch/arm64/boot/Image"
          else
            grep -a -q 'Linux version 4.4.302-ALice-V9-DSDS-GPU455-SLMK-EAS-65C-Permissive' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package flashable V9 hardware stage
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          AK3="anykernel-${{ matrix.variant }}"
          mkdir -p "$DEST"
          git init "$AK3"
          git -C "$AK3" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK3" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK3" checkout --detach FETCH_HEAD
          rm -rf "$AK3/.git" "$AK3/README.md" "$AK3/.github"
          cp packaging/anykernel.sh "$AK3/anykernel.sh"
          cp "$OUT/arch/arm64/boot/Image" "$AK3/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$AK3/dtb"
          (
            cd "$AK3"
            zip -qr9 "../$DEST/ALice-V9-DSDS-GPU455-SLMK-EAS-65C-${{ matrix.variant }}-${GITHUB_SHA::8}.zip" .
          )
          cp "$OUT/arch/arm64/boot/Image" "$DEST/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/dtb.img"
          cp "$OUT/System.map" "$DEST/System.map"
          cp "$OUT/.config" "$DEST/kernel.config"
          (
            cd "$DEST"
            sha256sum ALice-V9-DSDS-GPU455-*.zip Image dtb.img System.map kernel.config > SHA256SUMS
          )

      - name: Upload ${{ matrix.variant }} V9 hardware stage
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v9-hwstage-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
