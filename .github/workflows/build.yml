name: Build V8 V6Base MGLRU SimpleLMK

on:
  workflow_dispatch:
  push:
    branches:
      - v8haloT45
    paths-ignore:
      - "tools/alice-kernel-trace/**"
      - ".github/workflows/build-alice-kernel-trace.yml"

permissions:
  contents: read

concurrency:
  group: v8-dream2lte-${{ github.ref }}
  cancel-in-progress: true

env:
  AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
  TOOLCHAIN_DIR: /home/runner/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [enforcing, permissive]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check restored V6 scheduler behavior
        run: |
          python3 scripts/test_cpu_ui_hints.py
          python3 scripts/test_schedutil_work.py

      - name: Check MGLRU reclaim output contract
        run: python3 scripts/test_mglru_reclaim_args.py

      - name: Cache GCC 14.2
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: arm-gnu-14.2.rel1-aarch64

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential ccache libssl-dev libelf-dev \
            python3 wget tar xz-utils zip
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /home/runner/tools
          wget -q -O /home/runner/tools/gcc.tar.xz \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf /home/runner/tools/gcc.tar.xz -C /home/runner/tools
          test -x "$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-gcc"

      - name: Cache compiler results
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: v8-dream2lte-ccache-${{ matrix.variant }}-${{ github.sha }}
          # Use the latest cache across variants: the serial permissive job
          # can reuse the common objects just built by enforcing. ccache
          # still validates compiler options and source/config contents.
          restore-keys: |
            v8-dream2lte-ccache-

      - name: Configure toolchain
        run: |
          ccache --max-size=2G
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=ccache $TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=ALice" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-v8" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Sat Sep 5 00:00:00 UTC 2026" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-ALice-V8-V6Base-MGLRU-Enforcing"
          else
            scripts/config --file "$OUT/.config" \
              --enable ALWAYS_PERMISSIVE \
              --enable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-ALice-V8-V6Base-MGLRU-Permissive"
          fi
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate V8 integration
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          CFG="$OUT/.config"
          grep -q '^CONFIG_LRU_GEN=y$' "$CFG"
          grep -q '^CONFIG_LRU_GEN_ENABLED=y$' "$CFG"
          grep -q '^CONFIG_NR_LRU_GENS=7$' "$CFG"
          grep -q '^CONFIG_TIERS_PER_GEN=4$' "$CFG"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y$' "$CFG"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_MINFREE=128$' "$CFG"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_TIMEOUT_MSEC=200$' "$CFG"
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' "$CFG"
          grep -q '^CONFIG_MEMCG=y$' "$CFG"
          grep -q '^CONFIG_SWAP=y$' "$CFG"
          grep -q '^CONFIG_ZRAM=y$' "$CFG"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y$' "$CFG"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$CFG"
          grep -q '^CONFIG_SCHED_CPU_UI_HINTS=y$' "$CFG"
          grep -q '^CONFIG_DEBUG_FS=y$' "$CFG"
          grep -q '^CONFIG_EVENT_TRACING=y$' "$CFG"
          grep -q '^CONFIG_TRACEPOINTS=y$' "$CFG"
          grep -q '^CONFIG_CONTEXT_SWITCH_TRACER=y$' "$CFG"
          grep -q '^# CONFIG_BT_DEBUGFS is not set$' "$CFG"
          grep -q '^# CONFIG_F2FS_STAT_FS is not set$' "$CFG"
          grep -q '^CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"$' "$CFG"
          grep -q '^CONFIG_ASHMEM=y$' "$CFG"
          grep -q '^CONFIG_F2FS_FS=y$' "$CFG"
          grep -q '^CONFIG_EROFS_FS=y$' "$CFG"
          grep -q '^CONFIG_OVERLAY_FS=y$' "$CFG"
          grep -q '^CONFIG_SECURITY_SELINUX=y$' "$CFG"
          grep -q '^CONFIG_KSU=y$' "$CFG"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$CFG"
          echo '0d6cc7fdbf41b4f301745f3ad93f87b6d0ef7962cbe77b435c80400a251768a7  kernel/sched/fair.c' | sha256sum -c -
          # Exact platform paths from the bootable UI1-Trace b70a07db baseline.
          echo 'c4f59d85cca8d79873e8bedc319801159a13668e951e9b665e47b1f2bc92b1b5  kernel/sched/cpufreq_schedutil.c' | sha256sum -c -
          echo '17a551e00394a25bb742a2cdddceee442e075da0ade4967c92764399514f31c1  drivers/watchdog/s3c2410_wdt.c' | sha256sum -c -
          echo '7db46362687ade9cc22ed7aa8857468e48eefcb95ab7ee39dbc8174ca19486b4  drivers/soc/samsung/exynos-reboot.c' | sha256sum -c -
          echo 'deafad37aeaef6bcb5e87da12eb917c15859664969c413148897d0ef8362fd68  drivers/staging/samsung/sec_reboot.c' | sha256sum -c -
          grep -q 'iod,name = "umts_ipc0"' arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          grep -q 'iod,name = "umts_ipc1"' arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          grep -q 'iod,id = <235>' arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          grep -q 'iod,id = <236>' arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          grep -q 'sbi_ds_det_mask = <0x3>' arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          for index in 0 1 2 3 4 5 6 7; do
            grep -q "iod,name = \"rmnet$index\"" arch/arm64/boot/dts/exynos/modem-ss355ap-pdata.dtsi
          done
          grep -q 'register_syscore_ops(&s3c2410wdt_syscore_ops)' drivers/watchdog/s3c2410_wdt.c
          ! grep -q 'SIMPLE_DEV_PM_OPS(s3c2410wdt_pm_ops' drivers/watchdog/s3c2410_wdt.c
          grep -q 'mark_oom_victim(vtsk)' drivers/android/simple_lmk.c
          ! grep -q 'set_tsk_thread_flag(t, TIF_MEMDIE)' drivers/android/simple_lmk.c
          grep -q 'module_param_array_named(adj,' drivers/android/simple_lmk.c
          grep -q 'Hard Reset keys held; waiting for PMIC reset' drivers/staging/samsung/sec_debug_hard_reset_hook.c
          ! sed -n '/hard_reset_hook_callback/,/^}/p' drivers/staging/samsung/sec_debug_hard_reset_hook.c | grep -q '^[[:space:]]*BUG();'
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$CFG"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$CFG"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$CFG"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$CFG"
          fi

      - name: Build kernel and DTB
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"
          ccache --show-stats

      - name: Validate output
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          NM="$TOOLCHAIN_DIR/bin/aarch64-none-linux-gnu-nm"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          test -s "$OUT/vmlinux"
          echo "d3907f8e50d3d66c193eb800bafdc20e356bdb400ccefc140074cfe92c155c20  $OUT/arch/arm64/boot/dtb.img" | sha256sum -c -
          "$NM" "$OUT/vmlinux" | grep -q ' lru_gen_set_state$'
          "$NM" "$OUT/vmlinux" | grep -q ' lru_gen_scan_around$'
          grep -a -q 'simple_lmk: Ready with global vmpressure' "$OUT/arch/arm64/boot/Image"
          strings -a "$OUT/arch/arm64/boot/Image" | grep -x -q '32590'

      - name: Package flashable kernel
        run: |
          set -eu
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          AK3="anykernel-${{ matrix.variant }}"
          mkdir -p "$DEST"
          git init "$AK3"
          git -C "$AK3" remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C "$AK3" fetch --depth=1 origin "$AK3_COMMIT"
          git -C "$AK3" checkout --detach FETCH_HEAD
          rm -rf "$AK3/.git" "$AK3/README.md" "$AK3/.github"
          cp packaging/anykernel.sh "$AK3/anykernel.sh"
          cp "$OUT/arch/arm64/boot/Image" "$AK3/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$AK3/dtb"
          (
            cd "$AK3"
            zip -qr9 "../$DEST/ALice-V8-V6Base-MGLRU-SLMK-${{ matrix.variant }}-${GITHUB_SHA::8}.zip" .
          )
          cp "$OUT/arch/arm64/boot/Image" "$DEST/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/dtb.img"
          cp "$OUT/System.map" "$DEST/System.map"
          cp "$OUT/.config" "$DEST/kernel.config"
          (
            cd "$DEST"
            sha256sum \
              ALice-V8-V6Base-MGLRU-SLMK-*.zip \
              Image dtb.img System.map kernel.config > SHA256SUMS
          )

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v8-build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: warn

      - name: Upload V8 flash package
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v8-mglru-simplelmk-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
