name: Build Dream2LTE SmoothFrame Charger and Apollo Fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ems-v2-experimental
      - 'backup/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - enforcing
          - permissive

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            wget \
            tar \
            xz-utils

      - name: Configure Python
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-balanced" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Tue Aug 25 12:00:00 +07 2026" >> "$GITHUB_ENV"

      - name: Verify compiler
        run: |
          ${CROSS_COMPILE}gcc --version

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = enforcing ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-Alice-SmoothFrame-KSU32590-LMK5-Enforcing"
          else
            scripts/config --file "$OUT/.config" \
              --set-str LOCALVERSION "-Alice-SmoothFrame-KSU32590-LMK5-Permissive"
          fi
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate configuration and integration
        run: |
          OUT="out-${{ matrix.variant }}"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_LSM_SECURITY_HOOKS is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set$' "$OUT/.config"
          grep -q '^CONFIG_KSU_HEURISTIC_IN_TREE_BUILD=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU_FEATURE_SULOG=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU_FEATURE_ADBROOT=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$OUT/.config"
          grep -q '^CONFIG_USB_CONFIGFS=y$' "$OUT/.config"
          grep -q '^CONFIG_USB_CONFIGFS_F_ADB=y$' "$OUT/.config"
          grep -q '^CONFIG_PRINTK=y$' "$OUT/.config"
          grep -q '^CONFIG_PSTORE=y$' "$OUT/.config"
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' "$OUT/.config"
          grep -q '^CONFIG_HARDLOCKUP_DETECTOR=y$' "$OUT/.config"
          grep -q '^# CONFIG_BOOTPARAM_HARDLOCKUP_PANIC is not set$' "$OUT/.config"
          grep -q '^CONFIG_BOOTPARAM_HARDLOCKUP_PANIC_VALUE=0$' "$OUT/.config"
          grep -q '^# CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC is not set$' "$OUT/.config"
          grep -q '^CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC_VALUE=0$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_MINFREE=128$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_TIMEOUT_MSEC=200$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_KSWAPD_PRIORITY=5$' "$OUT/.config"
          ! grep -q '^CONFIG_ANDROID_LOW_MEMORY_KILLER=' "$OUT/.config"
          grep -q '^CONFIG_MEMCG=y$' "$OUT/.config"
          grep -q '^CONFIG_SWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          ! grep -q '^CONFIG_SEC_DEBUG.*=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$OUT/.config"
          grep -q '^CONFIG_EROFS_FS=y$' "$OUT/.config"
          grep -q -- '-DKSU_VERSION=32590' drivers/kernelsu/Makefile
          grep -q '^KSU_EXPECTED_SIZE := 0x0363$' drivers/kernelsu/Makefile
          grep -q '^KSU_EXPECTED_HASH := 4359c171f32543394cbc23ef908c4bb94cad7c8087002ba164c8230948c21549$' drivers/kernelsu/Makefile
          grep -q '^e874376f71d80c6ee4163fafdc03e62412adbc49$' drivers/kernelsu/UPSTREAM_COMMIT
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(1000)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(20000)' kernel/sched/cpufreq_schedutil.c
          grep -q '^unsigned int capacity_margin = 1024;$' kernel/sched/fair.c
          ! grep -q '^unsigned int capacity_margin = 1126;$' kernel/sched/fair.c
          ! grep -q '^unsigned int capacity_margin = 1205;$' kernel/sched/fair.c
          ! grep -q '^unsigned int capacity_margin = 1280;$' kernel/sched/fair.c
          grep -q 'freq = (freq + (freq >> 2)) \* util / max;' kernel/sched/cpufreq_schedutil.c
          grep -q 'raw_spin_lock_irqsave(&sg_policy->update_lock, flags);' kernel/sched/cpufreq_schedutil.c
          grep -q 'freq = sg_policy->next_freq;' kernel/sched/cpufreq_schedutil.c
          grep -q 'kthread_bind_mask(thread, cpumask_of(SUGOV_WORKER_CPU));' kernel/sched/cpufreq_schedutil.c
          grep -q 'max-freq = <2002000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'max-freq = <2704000>;' arch/arm64/boot/dts/exynos/exynos8895-dream2lte_common.dtsi
          grep -q 'APOLLO_COOLING_RELEASE_TEMP.*71000' drivers/thermal/samsung/exynos_tmu.c
          grep -q 'polling-delay = <1000>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'cooling-device = <&cpu0 4 4>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'cooling-device = <&cpu0 11 11>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'sample_count++ < 50' drivers/battery_v2/max77865_charger.c
          grep -q 'value = { .intval = 0 }' drivers/battery_v2/max77865_charger.c
          grep -q 'MAX77865 can assert fuel-gauge and' drivers/mfd/max77865-irq.c
          grep -q 'ignore stale QC work for dev' drivers/muic/universal/muic_hv_max77865.c
          grep -q 'cpu = start_cpu(p, boosted);' kernel/sched/fair.c
          grep -q 'if (boosted)' kernel/sched/fair.c
          grep -q 'return rd->max_cap_orig_cpu;' kernel/sched/fair.c
          test ! -e drivers/staging/android/lowmemorykiller.c
          test ! -e drivers/staging/android/trace/lowmemorykiller.h
          grep -q 'simple_lmk_decide_reclaim' mm/vmscan.c
          grep -q 'simple_lmk_mm_freed' kernel/fork.c
          grep -q 'simple_lmk_oom_reclaim' drivers/android/simple_lmk.c
          grep -q 'set_user_nice(current, -10)' drivers/android/simple_lmk.c
          ! grep -q 'sched_setscheduler_nocheck.*SCHED_FIFO' drivers/android/simple_lmk.c
          grep -q 'ksu_bprm_check' security/security.c
          grep -q 'ksu_inode_rename' security/security.c
          grep -q 'ksu_file_permission' security/security.c
          grep -q 'ksu_task_fix_setuid' security/security.c
          grep -q 'ksu_hide_setprocattr' security/security.c
          grep -q 'ksu_handle_execveat' fs/exec.c
          grep -q 'ksu_handle_faccessat' fs/open.c
          grep -q 'ksu_handle_stat' fs/stat.c
          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c
          ! grep -q 'ksu_' kernel/sys.c
          if [ "${{ matrix.variant }}" = enforcing ]; then
            grep -q '^CONFIG_LOCALVERSION="-Alice-SmoothFrame-KSU32590-LMK5-Enforcing"$' "$OUT/.config"
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_LOCALVERSION="-Alice-SmoothFrame-KSU32590-LMK5-Permissive"$' "$OUT/.config"
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
            grep -q 'new_value = 0;' security/selinux/selinuxfs.c
          fi
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' "$OUT/.config"

      - name: Build ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img

      - name: Validate kernel and updated DTB
        run: |
          OUT="out-${{ matrix.variant }}"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          strings -a "$OUT/arch/arm64/boot/dtb.img" | grep -q '^APOLLO$'
          sha256sum "$OUT/arch/arm64/boot/dtb.img"
          strings -a "$OUT/arch/arm64/boot/Image" | grep -q '^32590$'
          grep -a -q 'Automated LSM hooking disabled' "$OUT/arch/arm64/boot/Image"
          grep -a -q 'hooks enabled: exec, faccessat, stat' "$OUT/arch/arm64/boot/Image"
          ! grep -a -q 'prevent gid 3009 assignment' "$OUT/arch/arm64/boot/Image"
          grep -a -q 'simple_lmk: ' "$OUT/arch/arm64/boot/Image"
          if [ "${{ matrix.variant }}" = permissive ]; then
            grep -a -q 'Linux version 4.4.302-Alice-SmoothFrame-KSU32590-LMK5-Permissive' "$OUT/arch/arm64/boot/Image"
            grep -a -q 'always-permissive build ignored enforcing request' "$OUT/arch/arm64/boot/Image"
          else
            grep -a -q 'Linux version 4.4.302-Alice-SmoothFrame-KSU32590-LMK5-Enforcing' "$OUT/arch/arm64/boot/Image"
            ! grep -a -q 'always-permissive build ignored enforcing request' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package ${{ matrix.variant }} output
        run: |
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          mkdir -p "$DEST"
          cp -v "$OUT/arch/arm64/boot/Image" "$DEST/"
          cp -v "$OUT/arch/arm64/boot/dtb.img" "$DEST/"
          cp -v "$OUT/System.map" "$DEST/"
          cp -v "$OUT/.config" "$DEST/kernel.config"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS"

      - name: Upload ${{ matrix.variant }} kernel
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-smoothframe-charger-apollo-simplelmk5-ksu-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
