name: Build balanced Dream2LTE SimpleLMK KSU-nohooks

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ems-v2-experimental
      - 'backup/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - enforcing
          - permissive

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            wget \
            tar \
            xz-utils

      - name: Configure Python
        run: |
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-balanced" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Tue Aug 25 12:00:00 +07 2026" >> "$GITHUB_ENV"

      - name: Verify compiler
        run: |
          ${CROSS_COMPILE}gcc --version

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = enforcing ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP
            make O="$OUT" olddefconfig
          fi

      - name: Validate configuration and integration
        run: |
          OUT="out-${{ matrix.variant }}"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^# CONFIG_KPROBES is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_LSM_SECURITY_HOOKS is not set$' "$OUT/.config"
          grep -q '^CONFIG_KSU_HEURISTIC_IN_TREE_BUILD=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU_FEATURE_ADBROOT=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_HOSTSREDIRECT is not set$' "$OUT/.config"
          grep -q '^CONFIG_USB_CONFIGFS=y$' "$OUT/.config"
          grep -q '^CONFIG_USB_CONFIGFS_F_ADB=y$' "$OUT/.config"
          grep -q '^CONFIG_PRINTK=y$' "$OUT/.config"
          grep -q '^CONFIG_PSTORE=y$' "$OUT/.config"
          grep -q '^CONFIG_PSTORE_CONSOLE=y$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK=y$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_MINFREE=128$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_TIMEOUT_MSEC=200$' "$OUT/.config"
          grep -q '^CONFIG_ANDROID_SIMPLE_LMK_KSWAPD_PRIORITY=1$' "$OUT/.config"
          ! grep -q '^CONFIG_ANDROID_LOW_MEMORY_KILLER=' "$OUT/.config"
          grep -q '^CONFIG_MEMCG=y$' "$OUT/.config"
          grep -q '^CONFIG_SWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          ! grep -q '^CONFIG_SEC_DEBUG.*=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$OUT/.config"
          grep -q '^CONFIG_EROFS_FS=y$' "$OUT/.config"
          grep -q -- '-DKSU_VERSION=32594' drivers/kernelsu/Makefile
          grep -q '^commit=f14aa96fc1817078ca50013b375631d499c42140$' drivers/kernelsu/UPSTREAM_COMMIT
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(5000)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(20000)' kernel/sched/cpufreq_schedutil.c
          grep -q '^unsigned int capacity_margin = 1205;$' kernel/sched/fair.c
          ! grep -q '^unsigned int capacity_margin = 1280;$' kernel/sched/fair.c
          grep -q 'cpu = start_cpu(p);' kernel/sched/fair.c
          ! grep -q 'return boosted ? rd->max_cap_orig_cpu : rd->min_cap_orig_cpu;' kernel/sched/fair.c
          test ! -e drivers/staging/android/lowmemorykiller.c
          test ! -e drivers/staging/android/trace/lowmemorykiller.h
          grep -q 'simple_lmk_decide_reclaim' mm/vmscan.c
          grep -q 'simple_lmk_mm_freed' kernel/fork.c
          ! grep -q 'ksu_' security/security.c
          ! grep -q 'ksu_' fs/exec.c
          ! grep -q 'ksu_' fs/open.c
          ! grep -q 'ksu_' fs/stat.c
          ! grep -q 'ksu_' kernel/reboot.c
          if [ "${{ matrix.variant }}" = enforcing ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
            grep -q 'new_value = 0;' security/selinux/selinuxfs.c
          fi

      - name: Build ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img

      - name: Validate known-good DTB
        run: |
          OUT="out-${{ matrix.variant }}"
          echo "2179adc007d6505fe976ceb6904d70e18bb34416791f06d2c6a617d119da4dd3  $OUT/arch/arm64/boot/dtb.img" | sha256sum -c -
          strings -a "$OUT/arch/arm64/boot/Image" | grep -q '^32594$'
          ! grep -a -q 'prevent gid 3009 assignment' "$OUT/arch/arm64/boot/Image"
          grep -a -q 'simple_lmk: ' "$OUT/arch/arm64/boot/Image"
          if [ "${{ matrix.variant }}" = permissive ]; then
            grep -a -q 'always-permissive build ignored enforcing request' "$OUT/arch/arm64/boot/Image"
          else
            ! grep -a -q 'always-permissive build ignored enforcing request' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package ${{ matrix.variant }} output
        run: |
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          mkdir -p "$DEST"
          cp -v "$OUT/arch/arm64/boot/Image" "$DEST/"
          cp -v "$OUT/arch/arm64/boot/dtb.img" "$DEST/"
          cp -v "$OUT/System.map" "$DEST/"
          cp -v "$OUT/.config" "$DEST/kernel.config"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS"

      - name: Upload ${{ matrix.variant }} kernel
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-balanced-simplelmk-ksu-nohooks-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
