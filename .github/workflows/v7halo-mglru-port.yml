name: v7halo MGLRU kernel build

on:
  push:
    branches:
      - v7halo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [enforcing, permissive]

    steps:
      - name: Checkout v7halo
        uses: actions/checkout@v4
        with:
          ref: v7halo
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 wget tar xz-utils
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure toolchain
        run: |
          set -euxo pipefail
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-v7halo" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Thu Sep 03 12:00:00 UTC 2026" >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.variant }}
        shell: bash
        run: |
          set -euxo pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig

          scripts/config --file "$OUT/.config" \
            --enable LRU_GEN \
            --enable LRU_GEN_ENABLED

          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-v7halo-MGLRU-Enforcing"
          else
            scripts/config --file "$OUT/.config" \
              --enable ALWAYS_PERMISSIVE \
              --enable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-v7halo-MGLRU-Permissive"
          fi

          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate MGLRU and scheduler state
        shell: bash
        run: |
          set -euxo pipefail
          OUT="out-${{ matrix.variant }}"
          grep -q '^CONFIG_LRU_GEN=y$' "$OUT/.config"
          grep -q '^CONFIG_LRU_GEN_ENABLED=y$' "$OUT/.config"
          test -f mm/page_vma_mapped.c
          grep -q 'lru_gen_' mm/vmscan.c
          grep -q 'unsigned int capacity_margin = 1205;' kernel/sched/fair.c
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(5000)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(20000)' kernel/sched/cpufreq_schedutil.c

      - name: Build kernel and DTB
        shell: bash
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"

      - name: Validate build output
        shell: bash
        run: |
          set -euxo pipefail
          OUT="out-${{ matrix.variant }}"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          strings -a "$OUT/arch/arm64/boot/Image" | grep -q 'Linux version 4.4.302-v7halo-MGLRU'

      - name: Package build artifacts
        shell: bash
        run: |
          set -euxo pipefail
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          mkdir -p "$DEST"
          cp "$OUT/arch/arm64/boot/Image" "$DEST/Image"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/dtb.img"
          cp "$OUT/System.map" "$DEST/System.map"
          cp "$OUT/.config" "$DEST/kernel.config"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7halo-mglru-build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: error

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: v7halo-mglru-kernel-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
