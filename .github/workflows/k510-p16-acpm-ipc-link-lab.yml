name: Alice K510 P16 ACPM IPC compiler + relocatable linkage (NO BOOT)
on:
  push:
    branches: ['experimental/k510-p16-acpm-ipc-link-lab']
    paths:
      - 'research/k510/p16-*'
      - 'research/k510/P16-*'
      - '.github/workflows/k510-p16-acpm-ipc-link-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Verify exact V12R5T donor
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
      - name: Stage genuine Linux 5.10 baseline and donor sources
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p16"
          mkdir -p "$OUT" ci-p16
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = "5.10.262"
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          bash research/k510/p13-stage-v12r5t-acpm.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p16/pinned-donor-sha256.log
          bash research/k510/p14-register-donor-kbuild.sh "$SRC" "$OUT" \
            | tee ci-p16/kbuild-registration.log
          python3 research/k510/p15-bridge-i2c.py "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p16/i2c-bridge.log
          bash research/k510/p16-stage-acpm-ipc-lab.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p16/acpm-dependency-import.log
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 prepare scripts
      - name: Compile six actual donor objects; fail on missing Kbuild rules
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p16"
          printf 'SOURCE\tRESULT\tEXIT_CODE\n' > ci-p16/compat-status.tsv
          bad_harness=0
          unknown=0
          for obj in \
            drivers/soc/samsung/acpm/acpm.o \
            drivers/soc/samsung/acpm/acpm_ipc.o \
            drivers/soc/samsung/acpm/acpm_mfd.o \
            drivers/mfd/s2mps17_core.o \
            drivers/mfd/s2mps17_irq.o \
            drivers/regulator/s2mps17.o; do
            name="$(basename "$obj" .o)"
            log="ci-p16/$name.log"
            if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              KCFLAGS=-DCONFIG_EXYNOS_ACPM "$obj" > "$log" 2>&1; then
              rc=0
            else
              rc=$?
            fi
            if grep -Eiq 'No rule to make target|No targets specified|No rule to make' "$log"; then
              status=HARNESS_ERROR
              bad_harness=1
            elif [ "$rc" -eq 0 ] && [ -s "$OUT/$obj" ]; then
              status=C_COMPILE_PASS_ONLY
            elif grep -Eq '(^|[[:space:]])(fatal )?error:|:[0-9]+(:[0-9]+)?: (fatal )?error:' "$log"; then
              status=C_API_OR_HEADER_BLOCKED
            else
              status=UNCLASSIFIED_BUILD_FAILURE
              unknown=1
            fi
            printf '%s\t%s\t%d\n' "$obj" "$status" "$rc" >> ci-p16/compat-status.tsv
            echo "===== $obj :: $status (make=$rc) ====="
            grep -En 'fatal error:|error:|No rule to make target' "$log" | head -n 12 || true
            tail -n 4 "$log"
          done
          cat ci-p16/compat-status.tsv
          test "$(wc -l < ci-p16/compat-status.tsv)" -eq 7
          if [ "$bad_harness" -ne 0 ] || [ "$unknown" -ne 0 ]; then
            echo 'P16 FAIL: test harness did not reach reliable compiler diagnostics.' >&2
            exit 33
          fi
          echo 'P16 compile inventory trustworthy; C_COMPILE_PASS_ONLY is not runtime support.' \
            | tee ci-p16/README.txt
          echo 'NO runtime-enabled ACPM, UFS, DT, Android init or boot.img. DO NOT FLASH.' \
            >> ci-p16/README.txt
      - name: Check real ACPM-to-PMIC relocatable link and undefined symbols
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/alice-k510/out-p16"
          cd "$GITHUB_WORKSPACE"
          if grep -v '^SOURCE' ci-p16/compat-status.tsv | grep -qv "$(printf '\tC_COMPILE_PASS_ONLY\t0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P16-ACPM-IPC-LINKAGE-LAB-NO-BOOT
          path: ci-p16/
          if-no-files-found: warn
          retention-days: 21
)"; then
            echo 'P16 compiler blockers remain. No link success can be claimed.' | tee ci-p16/link-status.txt
            exit 40
          fi
          aarch64-linux-gnu-ld -r -o ci-p16/acpm-pmic-relocatable.o \
            "$OUT/drivers/soc/samsung/acpm/acpm.o" \
            "$OUT/drivers/soc/samsung/acpm/acpm_ipc.o" \
            "$OUT/drivers/soc/samsung/acpm/acpm_mfd.o" \
            "$OUT/drivers/mfd/s2mps17_core.o" \
            "$OUT/drivers/mfd/s2mps17_irq.o" \
            "$OUT/drivers/regulator/s2mps17.o"
          aarch64-linux-gnu-nm -g --defined-only ci-p16/acpm-pmic-relocatable.o > ci-p16/defined-symbols.txt
          aarch64-linux-gnu-nm -u ci-p16/acpm-pmic-relocatable.o > ci-p16/unresolved-symbols.txt
          for symbol in \
            acpm_ipc_request_channel acpm_ipc_send_data \
            exynos_acpm_read_reg exynos_acpm_write_reg \
            s2mps17_read_reg s2mps17_write_reg; do
            if ! grep -Eq " [A-Z] $symbol$" ci-p16/defined-symbols.txt; then
              echo "P16 missing required ACPM/PMIC symbol: $symbol" >&2
              exit 41
            fi
          done
          {
            echo 'Relocatable ACPM/PMIC cross-object link PASS.'
            echo 'This is NOT a final vmlinux link; unresolved external kernel/SoC symbols remain.'
            echo 'CONFIG_EXYNOS_ACPM is compiler-only for this LAB; no DT probe or BOOT generated.'
          } | tee ci-p16/link-status.txt
          echo 'First unresolved kernel/SoC symbol entries:'
          head -n 40 ci-p16/unresolved-symbols.txt
      - name: Preserve real compiler logs (not flashable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P16-ACPM-IPC-LINKAGE-LAB-NO-BOOT
          path: ci-p16/
          if-no-files-found: warn
          retention-days: 21
