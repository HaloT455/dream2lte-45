name: Agent v7 scheduler cleanup

on:
  push:
    branches:
      - v7halo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !startsWith(github.event.head_commit.message, 'agent:') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout v7halo
        uses: actions/checkout@v4
        with:
          ref: v7halo
          fetch-depth: 0

      - name: Remove ca151 EAS capacity-margin change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/sched/fair.c')
          s = p.read_text()
          old = '''/*
           * Use the standard EAS capacity headroom.  Keeping this aligned with
           * schedutil's 1.25 tipping factor lets EAS select a suitable cluster and
           * schedutil select its frequency from the same utilization signal, without
           * an A53-first 85% spill gate.
           */
          unsigned int capacity_margin = 1280;
          '''
          new = '''/*
           * 1205 is the historical EAS capacity margin used by this 4.4 tree.
           * Restore it without touching later scheduler changes.
           */
          unsigned int capacity_margin = 1205;
          '''
          if old not in s:
              needle = 'unsigned int capacity_margin = 1280;'
              if needle not in s:
                  raise SystemExit('capacity_margin=1280 not found; refusing unrelated edit')
              s = s.replace(needle, 'unsigned int capacity_margin = 1205;', 1)
          else:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Align CI validation with restored EAS margin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          s = s.replace("grep -q '^unsigned int capacity_margin = 1280;$' kernel/sched/fair.c",
                        "grep -q '^unsigned int capacity_margin = 1205;$' kernel/sched/fair.c")
          p.write_text(s)
          PY

      - name: Verify targeted changes only
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^unsigned int capacity_margin = 1205;$' kernel/sched/fair.c
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(2500)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(8000)' kernel/sched/cpufreq_schedutil.c
          if grep -q '^CONFIG_LRU_GEN=' arch/arm64/configs/exynos8895-dream2lte_defconfig; then
            echo 'Unexpected pre-existing LRU_GEN config found'
          else
            echo 'MGLRU is not present in the 4.4 tree yet; no fake/stub integration will be added.'
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/sched/fair.c .github/workflows/build.yml
          git commit -m 'agent: restore EAS capacity margin on v7halo'
          git push origin HEAD:v7halo
