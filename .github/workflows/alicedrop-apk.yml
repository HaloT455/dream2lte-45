name: AliceDrop Android alpha
on:
  workflow_dispatch:
  push:
    branches: [alice-airdrop-probe]
    paths: ['alice/alicedrop/**', '.github/workflows/alicedrop-apk.yml']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: AliceDrop-ARM64-protocol-experiment
          run-id: 45555705240
          github-token: ${{ github.token }}
          path: native-artifact
      - name: Verify native dependency
        run: |
          cd native-artifact
          sha256sum -c SHA256SUMS
          test "$(cat UPSTREAM_COMMIT)" = 34bdc8dfdd9c3eebd5b5bd8588b2fad2243a8e9c
          readelf -h libairdrop_ffi.so | grep AArch64
          readelf -Ws libairdrop_ffi.so | grep Java_tech_airdrop4e_A4eCore_sendFiles
      - name: Build dependency-free Java APK using Android SDK
        shell: bash
        run: |
          set -euo pipefail
          APP=alice/alicedrop/app
          SDK="${ANDROID_HOME}/platforms/android-35/android.jar"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p out-apk/classes out-apk/dex "$APP/build/outputs/apk/debug"
          find "$APP/src/main/java" -name '*.java' > out-apk/sources.txt
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$SDK" -d out-apk/classes @out-apk/sources.txt
          jar cf out-apk/classes.jar -C out-apk/classes .
          "$BT/d8" --lib "$SDK" --min-api 26 --output out-apk/dex out-apk/classes.jar
          python3 - <<'PY'
          from pathlib import Path
          p=Path('alice/alicedrop/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('<manifest ', '<manifest package="com.halot455.alicedrop" android:versionCode="4" android:versionName="0.4-native-sender" ',1)
          s=s.replace('<application ', '<uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35"/>\n<application ',1)
          Path('out-apk/AndroidManifest.xml').write_text(s)
          PY
          "$BT/aapt2" link -I "$SDK" --manifest out-apk/AndroidManifest.xml -o out-apk/base.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('out-apk/base.apk','a') as z:
              z.write('out-apk/dex/classes.dex','classes.dex',compress_type=zipfile.ZIP_DEFLATED)
              z.write('native-artifact/libairdrop_ffi.so','lib/arm64-v8a/libairdrop_ffi.so',compress_type=zipfile.ZIP_DEFLATED)
              z.write('native-artifact/LICENSE','assets/airdrop-core-LICENSE.txt')
          PY
          "$BT/zipalign" -p -f 4 out-apk/base.apk out-apk/aligned.apk
          keytool -genkeypair -keystore out-apk/test.jks -storepass android -keypass android -alias alicedrop -dname "CN=AliceDrop Test" -keyalg RSA -keysize 2048 -validity 3650
          "$BT/apksigner" sign --ks out-apk/test.jks --ks-pass pass:android --key-pass pass:android --out "$APP/build/outputs/apk/debug/app-debug.apk" out-apk/aligned.apk
          "$BT/apksigner" verify --verbose "$APP/build/outputs/apk/debug/app-debug.apk"
      - run: |
          mkdir -p artifact
          cp alice/alicedrop/app/build/outputs/apk/debug/app-debug.apk artifact/AliceDrop-alpha.apk
          cd artifact
          unzip -t AliceDrop-alpha.apk
          sha256sum AliceDrop-alpha.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: AliceDrop-alpha-APK
          path: artifact/
