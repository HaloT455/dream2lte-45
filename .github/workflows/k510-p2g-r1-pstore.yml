name: Alice K510 P2G-R1 ramoops debug compile (NOT FLASHABLE)
on:
  push:
    branches: ['experimental/k510-p2g-r1-pstore-debug']
    paths:
      - 'research/k510/p2g-r1-pstore.sh'
      - '.github/workflows/k510-p2g-r1-pstore.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-persistent-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux 5.10 ARM64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Stage genuine 5.10 Exynos8895 P1/P2 research tree
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
      - name: Apply pstore RAM reservation and native 5.10 configs
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p2g-r1"
          mkdir -p "$OUT" ci-p2g-r1
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT" \
            2>&1 | tee ci-p2g-r1/pstore-config.log
          cp "$OUT/.config" ci-p2g-r1/compiled.config
      - name: Compile kernel and DTB; verify exact persistent RAM address
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p2g-r1"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 Image exynos/exynos8895-dream2lte.dtb \
            2>&1 | tee ci-p2g-r1/build.log
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          test -s "$OUT/arch/arm64/boot/Image"
          fdtget -t x "$DTB" '/reserved-memory/ramoops@92000000' reg \
            | tee ci-p2g-r1/ramoops-reg.txt
          grep -qx '0 92000000 8000' ci-p2g-r1/ramoops-reg.txt
          test "$(fdtget -t x "$DTB" '/reserved-memory/ramoops@92000000' record-size)" = 4000
          test "$(fdtget -t x "$DTB" '/reserved-memory/ramoops@92000000' console-size)" = 4000
          fdtget -t s "$DTB" '/reserved-memory/ramoops@92000000' compatible | grep -qx ramoops
          fdtget -t s "$DTB" /chosen bootargs | tee ci-p2g-r1/chosen.txt
          grep -q 'initcall_debug' ci-p2g-r1/chosen.txt
          test "$(fdtget -l "$DTB" /reserved-memory | wc -l)" -eq 13
      - name: Logs only — do not release a new boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K510-P2G-R1-PSTORE-DEBUG-COMPILE-ONLY
          path: |
            ci-p2g-r1/pstore-config.log
            ci-p2g-r1/ramoops-reg.txt
            ci-p2g-r1/chosen.txt
            ci-p2g-r1/compiled.config
          if-no-files-found: warn
          retention-days: 14
