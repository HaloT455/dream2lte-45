name: S8Plus Exynos8895 Balanced Sustained Battery CI

on:
  push:
    branches:
      - agent/s8plus-v12r69-balanced-sustained-battery-20261114
  workflow_dispatch:

concurrency:
  group: s8plus-balanced-battery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - name: Checkout S8Plus only
        uses: actions/checkout@v4

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 wget tar xz-utils
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Install pinned GNU Arm64 compiler
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure kernel toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=alice" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=s8plus-balanced-battery-lz4kd" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Sat Nov 14 00:00:00 UTC 2026" >> "$GITHUB_ENV"

      - name: Host safety tests
        run: |
          set -eux
          python3 scripts/test_s8plus_reverse_energy.py
          python3 scripts/test_s8plus_balanced_energy.py
          python3 scripts/test_v12r68_energy_step.py
          python3 scripts/test_v12r69_energy_step_worker.py
          python3 scripts/test_schedutil_work.py
          sh -n scripts/collect_s8plus_game_perf.sh
          git diff --check

      - name: Generate S8Plus config
        run: |
          make O=out-reverse exynos8895-dream2lte_defconfig
          scripts/config --file out-reverse/.config \
            --disable ALWAYS_PERMISSIVE \
            --disable SECURITY_SELINUX_DEVELOP \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-Alice-S8P-BALANCED-BATT-TEST"
          make O=out-reverse olddefconfig

      - name: Verify kernel feature flags
        run: |
          set -eux
          C=out-reverse/.config
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYSTEP=y$' "$C"
          grep -q 'base + (base >> 4)' kernel/sched/cpufreq_energy_step.c
          grep -q '^CONFIG_CPU_FREQ_GOV_ENERGYSTEP=y$' "$C"
          grep -q '^CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y$' "$C"
          grep -q '^CONFIG_ZRAM=y$' "$C"
          grep -q '^CONFIG_ZRAM_DEF_COMP_LZ4KD=y$' "$C"
          grep -q '^CONFIG_CRYPTO_LZ4KD=y$' "$C"
          grep -q '^CONFIG_LZ4KD_COMPRESS=y$' "$C"
          grep -q '^CONFIG_LZ4KD_DECOMPRESS=y$' "$C"
          grep -q '^CONFIG_PSI=y$' "$C"
          grep -q '^CONFIG_MEMCG=y$' "$C"
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' "$C"
          grep -q '^# CONFIG_ANDROID_SIMPLE_LMK is not set$' "$C"
          grep -q '^# CONFIG_MALI_HALO_NPU_PARTITION is not set$' "$C"
          grep -q '^CONFIG_EXYNOS_VPU_HARDWARE=y$' "$C"
          grep -q '^CONFIG_MALI_TMIX_R19P0=y$' "$C"
          grep -q '^CONFIG_LRU_GEN=y$' "$C"
          test -f crypto/lz4kd.c
          test -f lib/lz4kd/lz4kd_encode.c
          test -f lib/lz4kd/lz4kd_decode.c

      - name: Build S8Plus kernel and DTBs
        run: |
          set -o pipefail
          make O=out-reverse -j"$(nproc)" Image dtb.img 2>&1 | tee build-s8plus-reverse.log

      - name: Verify compiled source and assemble artifacts
        run: |
          set -eux
          IMAGE=out-reverse/arch/arm64/boot/Image
          DTB=out-reverse/arch/arm64/boot/dtb.img
          test -s "$IMAGE"
          test -s "$DTB"
          grep -Eq ' [a-zA-Z] cpufreq_gov_energy_step$' out-reverse/System.map
          grep -Eq ' [a-zA-Z] lz4kd_encode$' out-reverse/System.map
          grep -Eq ' [a-zA-Z] lz4kd_decode$' out-reverse/System.map
          mkdir -p artifacts
          cp "$IMAGE" artifacts/S8Plus_V12R69_BalancedBattery_LZ4KD_Image
          cp "$DTB" artifacts/S8Plus_V12R69_BalancedBattery_LZ4KD_dtb.img
          cp out-reverse/.config artifacts/S8Plus_V12R69_BalancedBattery_LZ4KD.config
          cp docs/S8PLUS_V12R69_REVERSE_ENERGY_GAME_LZ4KD.md artifacts/
          cp docs/S8PLUS_BALANCED_SUSTAINED_BATTERY.md artifacts/
          cp scripts/collect_s8plus_game_perf.sh artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS)

      - name: Upload reproducible kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S8Plus-V12R69-BalancedSustainedBattery-LZ4KD-Kernel-WIP
          path: artifacts/
          if-no-files-found: error

      - name: Upload log for failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S8Plus-V12R69-BalancedSustainedBattery-Failed-Build-Log
          path: build-s8plus-reverse.log
          if-no-files-found: ignore
