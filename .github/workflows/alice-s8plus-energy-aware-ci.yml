name: ALice S8Plus EGO Inspired energy_aware CI
on:
  push:
    branches:
      - agent/s8plus-a53-ego-esg-port-20261123
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout dedicated ALice source branch
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev python3 wget tar xz-utils
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download toolchain
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          wget -q --show-progress -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure compiler
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=alice" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=s8plus-energy-aware" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: Generate strict energy-aware config
        run: |
          set -eux
          make O=out-ea exynos8895-dream2lte_defconfig
          scripts/config --file out-ea/.config \
            --disable ALWAYS_PERMISSIVE \
            --disable SECURITY_SELINUX_DEVELOP \
            --disable LOCALVERSION_AUTO \
            --disable CPU_FREQ_DEFAULT_GOV_ENERGYSTEP \
            --disable CPU_FREQ_GOV_ENERGYSTEP \
            --disable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --disable CPU_FREQ_GOV_SCHEDUTIL \
            --disable ALICE_BATTERY_RESERVE \
            --enable CPU_FREQ_GOV_ENERGYAWARE \
            --enable CPU_FREQ_DEFAULT_GOV_ENERGYAWARE \
            --set-str LOCALVERSION "-Alice-S8P-EA-KSU-LZ4KD"
          make O=out-ea olddefconfig

      - name: Assert kernel-only integration
        run: |
          set -eux
          C=out-ea/.config
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYAWARE=y$' "$C"
          grep -q '^CONFIG_CPU_FREQ_GOV_ENERGYAWARE=y$' "$C"
          ! grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYSTEP=y$' "$C"
          ! grep -q '^CONFIG_CPU_FREQ_GOV_ENERGYSTEP=y$' "$C"
          ! grep -q '^CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y$' "$C"
          ! grep -q '^CONFIG_ALICE_BATTERY_RESERVE=y$' "$C"
          grep -q '^CONFIG_KSU=y$' "$C"
          grep -q '^CONFIG_ZRAM_DEF_COMP_LZ4KD=y$' "$C"
          grep -q '^CONFIG_CRYPTO_LZ4KD=y$' "$C"
          grep -q 'sge_array\[' kernel/sched/cpufreq_energy_aware.c
          grep -q 'eagov_energy_model_freq' kernel/sched/cpufreq_energy_aware.c
          grep -q 'eagov_dts_step_power' kernel/sched/cpufreq_energy_aware.c
          grep -q 'energy_step = __ATTR_RW(energy_step)' kernel/sched/cpufreq_energy_aware.c
          grep -q 'core_dynamic \* total_load' kernel/sched/cpufreq_energy_aware.c
          grep -q 'cluster_dynamic \* peak_load' kernel/sched/cpufreq_energy_aware.c
          grep -q 'SD_LEVEL1' kernel/sched/cpufreq_energy_aware.c
          grep -q 'cpufreq_for_each_valid_entry(opp, policy->freq_table)' kernel/sched/cpufreq_energy_aware.c
          grep -q 'ego_find_energy_freq' kernel/sched/cpufreq_energy_aware.c
          grep -q '.name = "energy_aware"' kernel/sched/cpufreq_energy_aware.c
          test -s research/samsung-energy_step-user-reference.c
          test -s research/samsung-a53-exynos1280-ego-reference.c
          ! grep -q 'get_next_freq' kernel/sched/cpufreq_energy_aware.c
          ! grep -q 'cached_raw_freq' kernel/sched/cpufreq_energy_aware.c

      - name: Verify real Samsung A53 energy costs and repacker syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/alice_ci_boot_repack.py
          python3 scripts/test_alice_energy_step_dts.py
          grep -q 'sched-energy-costs' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'CPU_COST_1: core-core1' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'CLUSTER_COST_1: cluster-core1' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'sge_array\[' kernel/sched/energy.c
          grep -q 'of_parse_phandle(cn, "sched-energy-costs"' kernel/sched/energy.c
          grep -q 'init_sched_energy_costs();' arch/arm64/kernel/topology.c
          grep -q 'init_cpu_topology();' arch/arm64/kernel/smp.c

      - name: Build Image and DTBs
        run: |
          set -o pipefail
          make O=out-ea -j4 Image dtb.img 2>&1 | tee build-energy-aware.log

      - name: Verify actual compiled symbols and publish
        run: |
          set -eux
          test -s out-ea/arch/arm64/boot/Image
          test -s out-ea/arch/arm64/boot/dtb.img
          grep -Eq ' [a-zA-Z] cpufreq_gov_energy_aware$' out-ea/System.map
          grep -Eq ' [a-zA-Z] lz4kd_encode$' out-ea/System.map
          grep -Eq ' [a-zA-Z] lz4kd_decode$' out-ea/System.map
          grep -a -q 'energy_aware' out-ea/arch/arm64/boot/Image
          mkdir -p artifact
          cp out-ea/arch/arm64/boot/Image artifact/Image-energy-aware
          cp out-ea/arch/arm64/boot/dtb.img artifact/dtb.img
          cp out-ea/.config artifact/energy-aware.config
          cp out-ea/System.map artifact/System.map
          (cd artifact && sha256sum Image-energy-aware dtb.img energy-aware.config System.map > SHA256SUMS)

      - name: Upload kernel build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S8Plus-A53-EGO-Adapted-EnergyAware-Kernel
          path: artifact/
          if-no-files-found: error

      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S8Plus-EnergyAware-build-log
          path: build-energy-aware.log
          if-no-files-found: ignore

      - name: Report missing original boot input
        if: ${{ hashFiles('boot-input/ALICE_original_boot.img', 'boot-input/ALICE_original_boot.zip') == '' }}
        run: |
          echo "::warning::Kernel built, but boot.img is NOT produced: boot-input/ALICE_original_boot.img (or .zip) is absent."
          echo "Supply a real original boot image from this exact device/ROM. No synthetic ramdisk/header is used."

      - name: Prepare genuine original Samsung boot image
        if: ${{ hashFiles('boot-input/ALICE_original_boot.img', 'boot-input/ALICE_original_boot.zip') != '' }}
        run: |
          set -euo pipefail
          if [ -f boot-input/ALICE_original_boot.img ] && [ -f boot-input/ALICE_original_boot.zip ]; then
            echo "::error::Provide ONE boot input, not both."
            exit 1
          fi
          if [ -f boot-input/ALICE_original_boot.zip ]; then
            test "$(unzip -Z1 boot-input/ALICE_original_boot.zip)" = "boot.img"
            unzip -p boot-input/ALICE_original_boot.zip boot.img > "$RUNNER_TEMP/ALICE_original_boot.img"
          else
            cp boot-input/ALICE_original_boot.img "$RUNNER_TEMP/ALICE_original_boot.img"
          fi
          test -s "$RUNNER_TEMP/ALICE_original_boot.img"
          printf 'ORIGINAL_BOOT=%s\n' "$RUNNER_TEMP/ALICE_original_boot.img" >> "$GITHUB_ENV"

      - name: Repack real boot image with freshly compiled Image and DTB
        if: ${{ hashFiles('boot-input/ALICE_original_boot.img', 'boot-input/ALICE_original_boot.zip') != '' }}
        run: |
          set -euo pipefail
          mkdir -p artifact-boot
          python3 scripts/alice_ci_boot_repack.py \
            --original-boot "$ORIGINAL_BOOT" \
            --image out-ea/arch/arm64/boot/Image \
            --dtb out-ea/arch/arm64/boot/dtb.img \
            --out artifact-boot/boot.img | tee artifact-boot/build-provenance.txt
          echo "Source commit: $GITHUB_SHA" >> artifact-boot/build-provenance.txt
          echo "Source branch: $GITHUB_REF_NAME" >> artifact-boot/build-provenance.txt
          cp out-ea/.config artifact-boot/kernel.config
          (cd artifact-boot && sha256sum boot.img kernel.config > SHA256SUMS)
          echo "TEST ONLY: NOT physically boot tested; original boot backup and recovery required." > artifact-boot/README-TEST-ONLY.txt

      - name: Upload REAL Samsung energy-aware boot.img test artifact
        if: ${{ hashFiles('boot-input/ALICE_original_boot.img', 'boot-input/ALICE_original_boot.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ALice-Exynos8895-EnergyAware-REAL-BOOT-${{ github.sha }}
          path: artifact-boot/
          if-no-files-found: error
