name: Alice K510 P22 Samsung 8895 FMP SMCCC secure ABI vmlinux (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p22-samsung-smc-fmp-security']
    paths:
      - 'research/k510/p22-*'
      - 'research/k510/P22-*'
      - '.github/workflows/k510-p22-samsung-smc-fmp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-final-kernel-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Validate V12R5T donor revision
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
      - name: Create Linux 5.10.262 full-link test tree
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p22"
          mkdir -p "$OUT" ci-p22
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          bash research/k510/p13-stage-v12r5t-acpm.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p22/pinned-donor.log
          bash research/k510/p14-register-donor-kbuild.sh "$SRC" "$OUT" | tee ci-p22/kbuild.log
          python3 research/k510/p15-bridge-i2c.py "$GITHUB_WORKSPACE" "$SRC" | tee ci-p22/i2c-migrate.log
          bash research/k510/p16-stage-acpm-ipc-lab.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p22/acpm-stage.log
          bash research/k510/p17-import-powermeter.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p22/powermeter-stage.log
          bash research/k510/p17-stage-final-link-config.sh "$SRC" "$OUT" | tee ci-p22/link-config-gate.log
          python3 research/k510/p20-port-ufs8895-calibration.py "$GITHUB_WORKSPACE" "$SRC" ci-p22 \
            | tee ci-p22/native-8895-calibration-stage.log
          test "$(python3 -c 'import json; print(json.load(open("ci-p22/p20-calibration-port.json"))["entry_count"])')" = 124
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.h"
          grep -q '"registered_driver": false' ci-p22/p20-calibration-port.json
          bash research/k510/p21-stage-ufs8895-engine.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p22/p21-engine-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.h"
          grep -qx 'obj-y += alice-ufs8895-engine.o' <(tail -n1 "$SRC/drivers/scsi/ufs/Makefile")
          python3 research/k510/p22-verify-smc-abi.py "$GITHUB_WORKSPACE" "$SRC" ci-p22 \
            | tee ci-p22/p22-smc-audit.log
          test -s ci-p22/p22-smc-abi-audit.json
          bash research/k510/p22-stage-smc-fmp.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p22/p22-secure-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-secure.c"
          grep -qx 'obj-y += alice-ufs8895-secure.o' <(tail -n1 "$SRC/drivers/scsi/ufs/Makefile")
          cp "$OUT/.config" ci-p22/K510-P22.config
          test "$(grep -c '^obj-y += .*\.o$' "$SRC/drivers/soc/samsung/acpm/Makefile")" -eq 3
      - name: Compile Exynos8895 original 124 calibration entries with real AArch64 toolchain
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p22"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-calibration.o > ci-p22/8895-calibration-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule' ci-p22/8895-calibration-compile.log | tail -n 45 || true
            tail -n 60 ci-p22/8895-calibration-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o" \
            | grep -E ' T alice_ufs8895_get_calibration$'
          echo 'P20_8895_CALIBRATION_C_OBJECT_PASS' | tee ci-p22/calibration-compile-status.txt
      - name: Compile real UFS 8895 PHY/UniPro interpreter against Linux 5.10
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p22"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-engine.o > ci-p22/ufs-engine-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' \
              ci-p22/ufs-engine-compile.log | tail -n 60 || true
            tail -n 80 ci-p22/ufs-engine-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o" \
            | grep -E ' T alice_ufs8895_(check_phase|run_phase)$' \
            | tee ci-p22/ufs-engine-elf-symbols.txt
          test "$(wc -l < ci-p22/ufs-engine-elf-symbols.txt)" -eq 2
          if grep -Eq 'platform_driver_register|__platform_driver|of_match_table' \
              research/k510/p21-ufs8895-engine.c; then
            echo 'P21 UNSAFE: must never register a hardware UFS driver' >&2
            exit 55
          fi
          echo 'P21_UFS_ENGINE_C_OBJECT=PASS; NO HARDWARE PROBE' \
            | tee ci-p22/ufs-engine-compile-status.txt
      - name: Compile Samsung 8895 FMP and SMU firmware calls using ARM SMCCC ABI
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p22"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-secure.o > ci-p22/smc-fmp-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-secure.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' \
              ci-p22/smc-fmp-compile.log | tail -n 70 || true
            tail -n 90 ci-p22/smc-fmp-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-secure.o" \
            | grep -E ' T alice_ufs8895_(secure_storage_init|secure_log_reset)$' \
            | tee ci-p22/smc-fmp-symbols.txt
          test "$(wc -l < ci-p22/smc-fmp-symbols.txt)" -eq 2
          # Real ARM SMCCC transport reference, not a fabricated exynos_smc stub.
          aarch64-linux-gnu-nm -u "$OUT/drivers/scsi/ufs/alice-ufs8895-secure.o" \
            | grep -E '__arm_smccc_smc|arm_smccc_smc' \
            | tee ci-p22/smc-real-transport.txt
          echo 'P22_SMC_FMP_REAL_C_OBJECT=PASS; NO FIRMWARE INVOCATION' \
            | tee ci-p22/smc-build-status.txt
      - name: Verify real Samsung powermeter C object before full kernel link
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p22"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/regulator/s2mps17_powermeter.o > ci-p22/powermeter-build.log 2>&1; then
            test -s "$OUT/drivers/regulator/s2mps17_powermeter.o"
            echo 'Original Samsung S2MPS17 powermeter compiled (C object only).'
          else
            rc=$?
            grep -En 'fatal error:|error:|No rule|Error [0-9]' ci-p22/powermeter-build.log | tail -n 40 || true
            tail -n 60 ci-p22/powermeter-build.log
            exit "$rc"
          fi
      - name: Build real vmlinux and DTB; fail on any kernel linker error
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p22"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 vmlinux exynos/exynos8895-dream2lte.dtb > ci-p22/full-build.log 2>&1; then
            echo 'FULL_VMLINUX_LINK=PASS' | tee ci-p22/build-status.txt
          else
            rc=$?
            echo "FULL_VMLINUX_LINK=FAIL exit=$rc" | tee ci-p22/build-status.txt
            grep -En 'undefined reference|multiple definition|fatal error:|error:|Error [0-9]+|No rule to make target' \
              ci-p22/full-build.log | tail -n 85 || true
            tail -n 90 ci-p22/full-build.log
            exit "$rc"
          fi
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          aarch64-linux-gnu-readelf -h "$OUT/vmlinux" > ci-p22/vmlinux-elf-header.txt
          grep -q 'Machine:.*AArch64' ci-p22/vmlinux-elf-header.txt
          cp "$OUT/System.map" ci-p22/System.map
          for sym in \
            s2mps17_powermeter_init s2mps17_powermeter_deinit \
            acpm_ipc_request_channel acpm_ipc_send_data exynos_acpm_read_reg \
            exynos_acpm_write_reg s2mps17_read_reg s2mps17_write_reg; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P17 FAILED: required interface $sym missing from final System.map" >&2
              exit 50
            }
          done
          grep -Eq ' [Tt] alice_ufs8895_get_calibration$' "$OUT/System.map" || {
            echo 'P20 FAILED: 8895 calibration C data absent from final vmlinux'
            exit 48
          }
          echo 'P20 124/124 original 8895 calibration rows linked, NO HW PROBE' \
            | tee ci-p22/calibration-link-status.txt
          for sym in alice_ufs8895_check_phase alice_ufs8895_run_phase; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P21 FAILED: hardware-gated UFS engine symbol $sym missing"; exit 54;
            }
          done
          echo 'P21 UFS 124-entry engine compiled and linked, NO HW PROBE' \
            | tee ci-p22/ufs-engine-final-link.txt
          for sym in alice_ufs8895_secure_storage_init alice_ufs8895_secure_log_reset; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P22 FAILED: Samsung secure ABI symbol $sym missing"; exit 56;
            }
          done
          echo 'P22 real ARM SMCCC FMP/SMU code in complete linked vmlinux; NO SECURE CALLS EXECUTED' \
            | tee ci-p22/p22-full-link.txt
          sha256sum "$OUT/vmlinux" "$DTB" > ci-p22/checksums-no-binaries.txt
          {
            echo 'P20: REAL vmlinux final kernel link and AArch64 ELF PASS.'
            echo 'All 7 donor ACPM/PMIC drivers, 124-row calibration tables, gated UFS interpreter and original Samsung FMP/SMU ARM SMCCC bridge linked.'
            echo 'DTB UFS still status=disabled.'
            echo 'NOT RUNTIME VERIFIED. Secure SMCCC bridge has zero callers and requires 4 explicit approvals; Samsung PRDT/FMP key flow remains UNVERIFIED. No hardware UFS probe/SMC executed.'
            echo 'No kernel binaries or boot.img published. NEVER FLASH.'
          } | tee ci-p22/README.txt
      - name: Publish exact compile/link evidence (exclude kernel binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P22-FULL-VMLINUX-GATE-NO-FLASH
          path: ci-p22/
          if-no-files-found: warn
          retention-days: 21
