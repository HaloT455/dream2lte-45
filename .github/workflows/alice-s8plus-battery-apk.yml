name: ALice S8Plus ESG1 Battery Dashboard Android APK
on:
  push:
    paths:
      - 'alice/battery-manager-android/**'
      - '.github/workflows/alice-s8plus-battery-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: alice/battery-manager-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact 80/20 battery state machine
        run: |
          mkdir -p /tmp/alice-battery-test
          javac -d /tmp/alice-battery-test app/src/main/java/com/halot455/alice/battery/BatteryMath.java tests/BatteryMathTest.java
          java -cp /tmp/alice-battery-test BatteryMathTest
      - name: Build signed Android debug APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify installable APK and stage deliverable
        run: |
          set -eux
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -16
          mkdir -p dist
          cp "$APK" dist/ALice_S8Plus_ESG1_Battery80_20_Root_Dashboard_TEST.apk
          cp README.md dist/README_APK_VI.md
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish APK file
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S8Plus-ESG1-Battery-Dashboard-ROOT-APK-TEST
          path: alice/battery-manager-android/dist/
          if-no-files-found: error
