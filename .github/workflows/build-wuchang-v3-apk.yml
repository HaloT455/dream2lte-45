name: Build Wuchang Interactive Kotlin V3 APK

on:
  push:
    branches:
      - wuchang-live-wallpaper
    paths:
      - 'WuchangLiveWallpaperKotlinV3/**'
      - '.github/workflows/build-wuchang-v3-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WuchangLiveWallpaperKotlinV3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V3 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VoThuongLiveWallpaper-Interactive-Kotlin-V3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoThuongLiveWallpaper-Interactive-Kotlin-V3
          path: WuchangLiveWallpaperKotlinV3/app/build/outputs/apk/debug/VoThuongLiveWallpaper-Interactive-Kotlin-V3.apk
          if-no-files-found: error
