name: ALICE V12R60 Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - agent/v12r60-alice-kernel-telemetry
      - agent/v12r60-alice-android-ci
    paths:
      - 'alice/android-app/**'
      - '.github/workflows/alice-android-app.yml'
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu Android GitHub runner already has cmdline-tools; avoid deprecated sdkmanager tools package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          SDKMGR="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Alice debug APK
        run: gradle -p alice/android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK
        run: |
          set -eu
          FILE=alice/android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$FILE"
          unzip -t "$FILE" | grep 'No errors detected'
          sha256sum "$FILE" > alice/android-app/apk.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ALICE-V12R60-Android-APK-${{ github.sha }}
          path: |
            alice/android-app/app/build/outputs/apk/debug/app-debug.apk
            alice/android-app/apk.SHA256SUMS
          if-no-files-found: error
