name: ALICE V12R69 R5 LRU-only APK
on:
  workflow_dispatch:
  push:
    branches:
      - agent/v12r69-r3-ci-kernel
    paths:
      - 'alice/android-app/**'
      - 'scripts/test_v12r69_r5_lru_only.py'
      - '.github/workflows/alice-android-app.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/alice-lru-r5.keystore
          key: alice-lru-debug-key-r5-stable
      - name: Create persistent debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/alice-lru-r5.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/alice-lru-r5.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check lean LRU-only package
        run: python3 scripts/test_v12r69_r5_lru_only.py
      - name: Build APK
        run: gradle -p alice/android-app :app:assembleDebug --no-daemon --stacktrace
      - name: Verify signature and package contents
        run: |
          set -eu
          test -s "$HOME/.android/alice-lru-r5.keystore"
          FILE=alice/android-app/app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$FILE"
          "$SDK/aapt" dump badging "$FILE" | tee alice/android-app/APK_INFO.txt
          ! unzip -Z1 "$FILE" | grep -E '(^lib/|gguf|llama|qwen|alice_memory|alice_process|alice_low_swap)'
          ! "$SDK/aapt" dump permissions "$FILE" | grep -E 'INTERNET|FOREGROUND_SERVICE|ACCESS_NETWORK_STATE'
          sha256sum "$FILE" > alice/android-app/apk.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ALICE-V12R69-R5-LRU-APK-${{ github.sha }}
          path: |
            alice/android-app/app/build/outputs/apk/debug/app-debug.apk
            alice/android-app/apk.SHA256SUMS
            alice/android-app/APK_INFO.txt
          if-no-files-found: error
          retention-days: 30
