name: Alice K510 P13 ACPM S2MPS17 donor API compatibility (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p13-acpm-s2mps17-compat']
    paths:
      - 'research/k510/p13-*'
      - '.github/workflows/k510-p13-acpm-s2mps17-compile-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  donor-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Verify exact working V12R5T donor revision
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
      - name: Prepare Linux 5.10 Exynos8895 headers and native UFS baseline
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          OUT="$K510_WORKDIR/out-p13"
          mkdir -p "$OUT" ci-p13
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          bash research/k510/p13-stage-v12r5t-acpm.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p13/donor-copy-sha256.txt
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 prepare scripts
      - name: Compile donor PMIC source isolated, report real compatibility errors
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p13"
          : > ci-p13/compat-status.tsv
          printf 'SOURCE\tRESULT\n' >> ci-p13/compat-status.tsv
          for obj in \
            drivers/soc/samsung/acpm/acpm_mfd.o \
            drivers/mfd/s2mps17_core.o \
            drivers/mfd/s2mps17_irq.o \
            drivers/regulator/s2mps17.o; do
              name="$(basename "$obj" .o)"
              if make -C "$SRC" O="$OUT" ARCH=arm64 \
                  CROSS_COMPILE=aarch64-linux-gnu- \
                  KCFLAGS=-DCONFIG_EXYNOS_ACPM \
                  "$obj" > "ci-p13/$name.log" 2>&1; then
                  printf '%s\tCOMPILE_PASS\n' "$obj" >> ci-p13/compat-status.tsv
              else
                  printf '%s\tAPI_PORT_BLOCKED\n' "$obj" >> ci-p13/compat-status.tsv
              fi
              tail -n 18 "ci-p13/$name.log" || true
          done
          cat ci-p13/compat-status.tsv
          echo "This is ABI/API compatibility inventory ONLY." > ci-p13/README.txt
          echo "No ACPM IPC firmware integration, no PMIC regulator probe, no UFS runtime." >> ci-p13/README.txt
          echo "No boot.img or runtime-enabled DT generated. Not flashable." >> ci-p13/README.txt
          echo "A compile pass does not imply a functioning S2MPS17 or One UI 8 boot." >> ci-p13/README.txt
          test "$(wc -l < ci-p13/compat-status.tsv)" -eq 5
      - name: Publish truthful compatibility results; NO flash image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P13-S2MPS17-ACPM-COMPAT-REPORT-NO-FLASH
          path: ci-p13/
          if-no-files-found: warn
          retention-days: 21
