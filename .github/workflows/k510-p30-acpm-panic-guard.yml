name: Alice K510 P30 Exynos8895 ACPM NULL panic guard + P10 handoff (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p30-acpm-ipc-null-init-guard']
    paths:
      - 'research/k510/p30-*'
      - 'research/k510/P30-*'
      - '.github/workflows/k510-p30-acpm-panic-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-final-kernel-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Validate V12R5T donor revision
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
      - name: Create Linux 5.10.262 full-link test tree
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p30"
          mkdir -p "$OUT" ci-p30
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          bash research/k510/p13-stage-v12r5t-acpm.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p30/pinned-donor.log
          bash research/k510/p14-register-donor-kbuild.sh "$SRC" "$OUT" | tee ci-p30/kbuild.log
          python3 research/k510/p15-bridge-i2c.py "$GITHUB_WORKSPACE" "$SRC" | tee ci-p30/i2c-migrate.log
          python3 research/k510/p30-stage-acpm-null-guard.py "$SRC" \
            | tee ci-p30/p30-acpm-fs-initcall-guard.log
          grep -q 'ALICE_P30_ACPM_FIRMWARE_UPDATE_SKIPPED' \
            "$SRC/drivers/soc/samsung/acpm/acpm.c"
          grep -q 'ALICE_P30_ACPM_IPC_NOT_READY' \
            "$SRC/drivers/soc/samsung/acpm/acpm_ipc.c"
          grep -q 'acpm_ipc_runtime_ready' \
            "$SRC/drivers/soc/samsung/acpm/acpm_ipc.h"
          ! grep -q 'alice,acpm-plugin-firmware-reviewed;' \
            "$SRC/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dts"
          bash research/k510/p16-stage-acpm-ipc-lab.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p30/acpm-stage.log
          bash research/k510/p17-import-powermeter.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p30/powermeter-stage.log
          bash research/k510/p17-stage-final-link-config.sh "$SRC" "$OUT" | tee ci-p30/link-config-gate.log
          python3 research/k510/p20-port-ufs8895-calibration.py "$GITHUB_WORKSPACE" "$SRC" ci-p30 \
            | tee ci-p30/native-8895-calibration-stage.log
          test "$(python3 -c 'import json; print(json.load(open("ci-p30/p20-calibration-port.json"))["entry_count"])')" = 124
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.h"
          grep -q '"registered_driver": false' ci-p30/p20-calibration-port.json
          bash research/k510/p21-stage-ufs8895-engine.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p30/p21-engine-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.h"
          grep -qx 'obj-y += alice-ufs8895-engine.o' <(tail -n1 "$SRC/drivers/scsi/ufs/Makefile")
          bash research/k510/p22-stage-ufs8895-smc.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p30/p22-smc-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-smc.c"
          bash research/k510/p23-stage-ufs8895-host.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p30/p23-host-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-host.c"
          python3 research/k510/p24-stage-ufs8895-bind.py "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p30/p24-host-platform-stage.log
          python3 research/k510/p27-fix-ufs-clock-pmu.py "$SRC" \
            | tee ci-p30/p27-clock-pmu-stage.log
          DTS="$SRC/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dts"
          grep -q 'CLK_GOUT_FSYS0_UFS_EMBD_I_ACLK' "$DTS"
          grep -q 'CLK_GOUT_FSYS0_UFS_EMBD_I_CLK_UNIPRO' "$DTS"
          grep -q 'samsung,pmu-phandle = <&pmu_system_controller>;' "$DTS"
          ! grep -Eq '^[[:space:]]*vcc-supply[[:space:]]*=' "$DTS" || {
            echo 'P27 FAILED: UFS VCC supplier unexpectedly added'; exit 72;
          }
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-bind.c"
          grep -q 'compatible = "alice,exynos8895-ufs-research"' \
            "$SRC/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dts"
          ! grep -q 'alice,hardware-audit-passed;' \
            "$SRC/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dts"
          grep -qx 'obj-y += alice-ufs8895-bind.o' <(tail -n 1 "$SRC/drivers/scsi/ufs/Makefile")
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-host.h"
          python3 research/k510/p23-audit-ufs-power.py "$GITHUB_WORKSPACE" "$SRC" \
            ci-p30/p23-ufs-hardware-abi-audit.json \
            | tee ci-p30/p23-ufs-hardware-abi-audit.log
          test "$(python3 -c 'import json; print(json.load(open("ci-p30/p23-ufs-hardware-abi-audit.json"))["ufs_vcc_type"])')" = 'GPIO-controlled regulator-fixed'
          grep -q '"registers_platform_driver": false' ci-p30/p23-ufs-hardware-abi-audit.json
          cp "$OUT/.config" ci-p30/K510-P30.config
          test "$(grep -c '^obj-y += .*\.o$' "$SRC/drivers/soc/samsung/acpm/Makefile")" -eq 3
      - name: Cross-compile corrected ACPM IPC and firmware initcall objects
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/soc/samsung/acpm/acpm.o drivers/soc/samsung/acpm/acpm_ipc.o \
            > ci-p30/p30-acpm-compile.log 2>&1; then
            test -s "$OUT/drivers/soc/samsung/acpm/acpm.o"
            test -s "$OUT/drivers/soc/samsung/acpm/acpm_ipc.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|implicit declaration|No rule' \
              ci-p30/p30-acpm-compile.log | tail -n 70 || true
            tail -n 90 ci-p30/p30-acpm-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/soc/samsung/acpm/acpm_ipc.o" \
            | grep -q ' T acpm_ipc_runtime_ready$'
          aarch64-linux-gnu-nm "$OUT/drivers/soc/samsung/acpm/acpm.o" \
            | grep -q ' U acpm_ipc_runtime_ready$'
          echo 'P30_ACPM_RUNTIME_READINESS_AND_GUARD_C_OBJECTS=PASS' \
            | tee ci-p30/p30-acpm-compile-status.txt
      - name: Compile Exynos8895 original 124 calibration entries with real AArch64 toolchain
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-calibration.o > ci-p30/8895-calibration-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule' ci-p30/8895-calibration-compile.log | tail -n 45 || true
            tail -n 60 ci-p30/8895-calibration-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o" \
            | grep -E ' T alice_ufs8895_get_calibration$'
          echo 'P20_8895_CALIBRATION_C_OBJECT_PASS' | tee ci-p30/calibration-compile-status.txt
      - name: Compile real UFS 8895 PHY/UniPro interpreter against Linux 5.10
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-engine.o > ci-p30/ufs-engine-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' \
              ci-p30/ufs-engine-compile.log | tail -n 60 || true
            tail -n 80 ci-p30/ufs-engine-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o" \
            | grep -E ' T alice_ufs8895_(check_phase|run_phase)$' \
            | tee ci-p30/ufs-engine-elf-symbols.txt
          test "$(wc -l < ci-p30/ufs-engine-elf-symbols.txt)" -eq 2
          if grep -Eq 'platform_driver_register|__platform_driver|of_match_table' \
              research/k510/p21-ufs8895-engine.c; then
            echo 'P21 UNSAFE: must never register a hardware UFS driver' >&2
            exit 55
          fi
          echo 'P21_UFS_ENGINE_C_OBJECT=PASS; NO HARDWARE PROBE' \
            | tee ci-p30/ufs-engine-compile-status.txt
      - name: Compile Samsung Exynos8895 FMP SMU secure monitor bridge with real ARM64 compiler
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-smc.o > ci-p30/ufs-smc-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-smc.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' ci-p30/ufs-smc-compile.log | tail -n 60 || true
            tail -n 80 ci-p30/ufs-smc-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-smc.o" \
            | grep -E ' T alice_8895_ufs_secure_(init|resume|log)$' \
            | tee ci-p30/ufs-smc-elf-symbols.txt
          test "$(wc -l < ci-p30/ufs-smc-elf-symbols.txt)" -eq 3
          echo 'P22_FMP_SMCCC_BRIDGE_C_OBJECT=PASS; NO FIRMWARE CALLS' \
            | tee ci-p30/ufs-smc-compile-status.txt
      - name: Compile Exynos8895 clock/regulator/SMC UFS host callbacks with real AArch64 toolchain
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-host.o > ci-p30/ufs-host-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-host.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' \
              ci-p30/ufs-host-compile.log | tail -n 90 || true
            tail -n 100 ci-p30/ufs-host-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-host.o" \
            | grep -E ' T alice_8895_(host_validate|get_host_ops)$' \
            | tee ci-p30/ufs-host-elf-symbols.txt
          test "$(wc -l < ci-p30/ufs-host-elf-symbols.txt)" -eq 2
          echo 'P23_REAL_HOST_CALLBACK_C_OBJECT=PASS; NO PLATFORM PROBE' \
            | tee ci-p30/ufs-host-object-status.txt
      - name: Compile real platform binding to ufshcd_pltfrm_init with AArch64 GCC
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-bind.o \
            > ci-p30/ufs-binding-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-bind.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration' \
              ci-p30/ufs-binding-compile.log | tail -n 90 || true
            tail -n 110 ci-p30/ufs-binding-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-bind.o" \
            | grep -E ' T alice_8895_ufs_bind_host$' \
            | tee ci-p30/binding-symbols.txt
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-bind.o" \
            | grep -E ' U ufshcd_pltfrm_init$'
          echo 'P24_REAL_UFS_PLATFORM_BIND_C_OBJECT=PASS; DT DISABLED' \
            | tee ci-p30/ufs-binding-status.txt
      - name: Verify real Samsung powermeter C object before full kernel link
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/regulator/s2mps17_powermeter.o > ci-p30/powermeter-build.log 2>&1; then
            test -s "$OUT/drivers/regulator/s2mps17_powermeter.o"
            echo 'Original Samsung S2MPS17 powermeter compiled (C object only).'
          else
            rc=$?
            grep -En 'fatal error:|error:|No rule|Error [0-9]' ci-p30/powermeter-build.log | tail -n 40 || true
            tail -n 60 ci-p30/powermeter-build.log
            exit "$rc"
          fi
      - name: Build real vmlinux and DTB; fail on any kernel linker error
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p30"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 vmlinux exynos/exynos8895-dream2lte.dtb > ci-p30/full-build.log 2>&1; then
            echo 'FULL_VMLINUX_LINK=PASS' | tee ci-p30/build-status.txt
          else
            rc=$?
            echo "FULL_VMLINUX_LINK=FAIL exit=$rc" | tee ci-p30/build-status.txt
            grep -En 'undefined reference|multiple definition|fatal error:|error:|Error [0-9]+|No rule to make target' \
              ci-p30/full-build.log | tail -n 85 || true
            tail -n 90 ci-p30/full-build.log
            exit "$rc"
          fi
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          aarch64-linux-gnu-readelf -h "$OUT/vmlinux" > ci-p30/vmlinux-elf-header.txt
          grep -q 'Machine:.*AArch64' ci-p30/vmlinux-elf-header.txt
          cp "$OUT/System.map" ci-p30/System.map
          for sym in \
            s2mps17_powermeter_init s2mps17_powermeter_deinit \
            acpm_ipc_request_channel acpm_ipc_send_data exynos_acpm_read_reg \
            exynos_acpm_write_reg s2mps17_read_reg s2mps17_write_reg; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P17 FAILED: required interface $sym missing from final System.map" >&2
              exit 50
            }
          done
          grep -Eq ' [Tt] alice_ufs8895_get_calibration$' "$OUT/System.map" || {
            echo 'P20 FAILED: 8895 calibration C data absent from final vmlinux'
            exit 48
          }
          echo 'P20 124/124 original 8895 calibration rows linked, NO HW PROBE' \
            | tee ci-p30/calibration-link-status.txt
          for sym in alice_ufs8895_check_phase alice_ufs8895_run_phase; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P21 FAILED: hardware-gated UFS engine symbol $sym missing"; exit 54;
            }
          done
          echo 'P21 UFS 124-entry engine compiled and linked, NO HW PROBE' \
            | tee ci-p30/ufs-engine-final-link.txt
          for sym in alice_8895_ufs_secure_init alice_8895_ufs_secure_resume alice_8895_ufs_secure_log; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P22 FAILED: missing compiled secure SMCCC bridge $sym"; exit 57;
            }
          done
          echo 'P22 Samsung UFS SMC bridge linked, firmware execution default DENIED' \
            | tee ci-p30/ufs-smc-final-link.txt
          for sym in alice_8895_host_validate alice_8895_get_host_ops; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P23 FAILED: missing Exynos8895 host callback or power gate $sym"; exit 58;
            }
          done
          echo 'P23 native host ABI, fixed-regulator VCC, ACPM/Speedy prerequisites and callbacks linked; NO PROBE' \
            | tee ci-p30/ufs-host-final-link.txt
          grep -Eq ' [Tt] acpm_ipc_runtime_ready$' "$OUT/System.map" || {
            echo 'P30 ACPM IPC runtime guard missing in final kernel'; exit 93;
          }
          echo 'P30 exynos_acpm_binary_update() fail-closed until IPC+firmware review' \
            | tee ci-p30/p30-acpm-runtime-guard-link.txt
          grep -Eq ' [Tt] alice_8895_ufs_bind_host$' "$OUT/System.map" || {
            echo 'P24 FAILED: missing real platform UFS binding in final vmlinux'; exit 68;
          }
          ! fdtget -t s "$DTB" /soc@0/ufs@11120000 compatible \
            | grep -q 'samsung,exynos7-ufs'
          fdtget -t s "$DTB" /soc@0/ufs@11120000 compatible \
            | grep -qx alice,exynos8895-ufs-research
          echo 'P24 genuine platform host binding linked, no boot or UFS probe' \
            | tee ci-p30/ufs-binding-final-link.txt
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status \
            | grep -qx disabled
          grep -q 'syscon_regmap_lookup_by_phandle' \
            "$SRC/drivers/scsi/ufs/alice-ufs8895-bind.c"
          echo 'P27 8895 native FSYS0 clocks and PMU phandle linked; VCC still gated' \
            | tee ci-p30/ufs-clock-pmu-final-link.txt
          sha256sum "$OUT/vmlinux" "$DTB" > ci-p30/checksums-no-binaries.txt
          {
            echo 'P20: REAL vmlinux final kernel link and AArch64 ELF PASS.'
            echo 'All 7 donor ACPM/PMIC drivers, 124-row calibration tables, and gated UFS PHY/UniPro interpreter, FMP/SMU SMCCC bridge, and guarded research-only platform binding into actual ufshcd_pltfrm_init linked in vmlinux.'
            echo 'DTB UFS still status=disabled.'
            echo 'NOT RUNTIME VERIFIED. Exynos8895 platform driver matches only DISABLED research DT and rejects unaudited probe. No UFS storage runtime, SMC/PMIC validation, or Android boot.'
            echo 'P30 may package an UNSIGNED research-only boot image in an additional artifact. NO FLASH until real hardware rollback and preboot diagnostics are verified.'
          } | tee ci-p30/README.txt
      - name: Build exact P30 ARM64 Image, Samsung DTBH and debug initramfs
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          SRC="$DIR/linux-5.10.262"
          OUT="$DIR/out-p30"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 Image >> ci-p30/full-build.log 2>&1
          IMAGE="$OUT/arch/arm64/boot/Image"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$IMAGE" && test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          fdtget -t s "$DTB" /soc@0/ufs@11120000 compatible \
            | grep -qx alice,exynos8895-ufs-research
          test "$(fdtget -t s "$DTB" /chosen stdout-path)" = 'serial0:115200n8'
          python3 - "$IMAGE" <<'PY'
          import pathlib,struct,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          assert data[0x38:0x3c] == b'ARM\x64', 'Missing real ARM64 Image'
          text_offset,image_size=struct.unpack_from('<QQ',data,8)
          assert text_offset <= 0x200000 and image_size >= len(data)
          print('P30_KERNEL_ARM64_IMAGE_HEADER_PASS; text_offset=',hex(text_offset),
                'runtime_size=',hex(image_size))
          PY
          bash research/k510/p2-make-initramfs.sh "$DIR/p30-init"
          python3 research/k510/p2f-dtbh-pack.py "$DTB" "$DIR/p30-dtbh.img"
          sha256sum "$IMAGE" "$DTB" "$DIR/p30-dtbh.img" \
            > ci-p30/P30-IMAGE-DTB-DTBH-sha256.txt
      - name: Build pinned uniLoader R3 with visible pre-Linux A/B markers and audit RAM
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          SRC="$DIR/out-p30/arch/arm64/boot"
          # Restore P10's physically evidenced DAIF/cache handoff corrections.
          # P28 omitted these optional flags; P30 must fail if unavailable.
          export ALICE_K510_P8_COPY_CHECK=1
          export ALICE_K510_P9_CPU_PROBE=1
          export ALICE_K510_P10_FIX_HANDOFF=1
          bash research/k510/p2-build-uniloader-lab.sh \
            "$SRC/Image" "$SRC/dts/exynos/exynos8895-dream2lte.dtb" \
            "$DIR/p30-init/initramfs.cpio.gz" "$DIR/p30-loader" \
            > ci-p30/uniloader-build.log 2>&1 || {
              tail -n 130 ci-p30/uniloader-build.log; exit 82;
            }
          BIN="$DIR/p30-loader/uniLoader/uniLoader"
          test -s "$BIN"
          for marker in \
            ALICE_P8_KERNEL_COPY_VERIFIED \
            ALICE_P8_RAMDISK_COPY_VERIFIED \
            ALICE_P8_BEFORE_ARM64_BRANCH \
            ALICE_P9_ENTRY_EL_ \
            ALICE_P9_MMU_ \
            ALICE_P9_DAIF_ \
            ALICE_P9_STATE_READ_DONE \
            ALICE_P10_DAIF_ALL_MASKED \
            ALICE_P10_KERNEL_CACHE_READY \
            ALICE_P10_RAMDISK_CACHE_READY \
            ALICE_P10_DTB_CACHE_READY \
            ALICE_P10_READY_TO_BRANCH; do
            strings "$BIN" | grep -Fq "$marker" || {
              echo "P30 MISSING ARM64 kernel handoff diagnostic $marker"; exit 86;
            }
          done
          echo 'P30 P8 COPY + P9 EL/DAIF + P10 PoC CACHE/HANDOFF PATCHES LINKED' \
            | tee ci-p30/p30-uniloader-handoff-markers.txt
          strings "$BIN" | grep -q 'ALICE_R3_STAGE_A_UNILOADER_VISIBLE'
          strings "$BIN" | grep -q 'ALICE_R3_STAGE_B_KERNEL_HANDOFF'
          grep -q '^CONFIG_PAYLOAD_ENTRY=0x98' "$DIR/p30-loader/uniLoader/.config"
          python3 research/k510/p2g-r2-layout-audit.py \
            --image "$SRC/Image" \
            --ramdisk "$DIR/p30-init/initramfs.cpio.gz" \
            --loader "$BIN" \
            --config "$DIR/p30-loader/uniLoader/.config" \
            --manifest research/k510/P1D-RMEM.txt \
            --report ci-p30/P30-RAM-OVERLAP-AUDIT.json
          sha256sum "$BIN" > ci-p30/uniloader-sha256.txt
      - name: Pack unverified SM-G955F diagnostic BOOT, reject any UFS activation
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          IMG="ci-p30/ALICE_K510_P30_G955F_RESEARCH_ONLY_NO_FLASH.img"
          python3 research/k510/p2g-pack-experimental-boot.py \
            --loader "$DIR/p30-loader/uniLoader/uniLoader" \
            --ramdisk "$DIR/p30-init/initramfs.cpio.gz" \
            --dtbh "$DIR/p30-dtbh.img" \
            --out "$IMG" \
            --report ci-p30/P30-boot-structure.json
          python3 - "$IMG" <<'PY'
          import hashlib,json,pathlib,struct,sys
          p=pathlib.Path(sys.argv[1]); d=p.read_bytes()
          assert len(d)==41943040 and d[:8]==b'ANDROID!'
          info=json.load(open('ci-p30/P30-boot-structure.json'))
          assert hashlib.sha256(d).hexdigest()==info['sha256']
          ks,ka,rs,ra,ss,sa,ta,page,ds=struct.unpack_from('<9I',d,8)
          assert (ka,ra,ta,page,ss)==(0x10008000,0x11000000,0x10000100,2048,0)
          aligned=lambda v:(v+page-1)//page*page
          start=page+aligned(ks)+aligned(rs)
          assert d[start:start+4]==b'DTBH'
          assert d[start+2048:start+2052]==b'\xd0\x0d\xfe\xed'
          assert d[start+aligned(ds):start+aligned(ds)+16]==b'SEANDROIDENFORCE'
          print('P30_BOOT_STRUCTURAL_FORMAT=PASS; NO HARDWARE TEST')
          PY
          cat > ci-p30/CRITICAL_NO_FLASH.txt <<'NOTICE'
          P30 SM-G955F / EXYNOS8895 RESEARCH BOOT IMAGE - UNSIGNED - NO FLASH.
          P30 addresses observed P29 Linux 5.10 panic at
          acpm_ipc_set_waiting_mode+0x10/0x20, null pointer FAR 0x30.
          ACPM plugin update now requires ready IPC and explicitly reviewed firmware.
          No ACPM/Speedy/PMIC hardware or UFS storage runtime is validated.
          P30 restores P8 copy checks, P9 CPU state logs, and P10 interrupt mask
          + cache maintenance that previously produced Linux 5.10 PID1 pstore
          evidence on the real SM-G955F; repeated hardware boot is UNPROVEN.
          Linux 5.10.262 links P20-P24/P27 UFS PHY/FMP/clock code, but UFS DT is disabled.
          The fixed UFS VCC GPIO regulator is not declared, FMP/ACPM firmware ABI not validated.
          The Linux 5.10 UFS driver MUST NOT probe; no userdata/system access is possible.
          P30 attempts uniLoader A/B + P8/P9/P10 handoff markers and experimental /init heartbeat.
          R1/R2 previously hung at Samsung logo with no credible Linux 5.10 execution logs.
          R3 S8 donor DECON register access is untested on this Galaxy S8+ board.
          NO hardware success or physical boot safety established in GitHub Actions.
          DO NOT FLASH, restore, or publish as usable One UI 8 or Android 16 boot.
          Requires independent reviewed pre-boot observability, original BOOT backup
          SHA256 76ab5c78bb475eba5fb994bd7a6269c693a652e6698eb68fbd9f5c858c176823,
          verified Download Mode + TWRP rollback, and hardware power/firmware audit.
          NOTICE
          sha256sum "$IMG" > ci-p30/P30-BOOT-SHA256.txt
      - name: Publish P30 unverified boot format diagnostic artifact (NEVER FLASH)
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P30-UNVERIFIED-RESEARCH-BOOT-NO-FLASH
          path: |
            ci-p30/ALICE_K510_P30_G955F_RESEARCH_ONLY_NO_FLASH.img
            ci-p30/P30-boot-structure.json
            ci-p30/P30-RAM-OVERLAP-AUDIT.json
            ci-p30/P30-BOOT-SHA256.txt
            ci-p30/CRITICAL_NO_FLASH.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish exact compile/link evidence (exclude kernel binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P30-FULL-VMLINUX-GATE-NO-FLASH
