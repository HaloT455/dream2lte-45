name: ALICE V12R5T Kernel and Camera Vendor Pair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v12r5t-camera-vendor-ci

permissions:
  contents: read

concurrency:
  group: alice-kernel-vendor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [enforcing, permissive]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 wget tar xz-utils
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Download GCC 14.2
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Configure toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-v12-ui1-mglru" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Mon Aug 31 00:00:00 UTC 2026" >> "$GITHUB_ENV"

      - name: Host scheduler regression checks
        run: |
          python3 scripts/test_schedutil_work.py
          python3 scripts/test_cpu_ui_hints.py
          python3 scripts/test_ui_trace.py
          python3 scripts/test_mglru_reclaim_stability.py
          python3 scripts/test_mglru_transition.py
          python3 scripts/test_mglru_accounting_audit.py
          python3 scripts/test_v12r5t_mglru_aging_lmkd.py
          python3 scripts/test_v12r5p_ion_cma_diag.py
          python3 scripts/test_v12r5q_page_isolation_diag.py
          python3 scripts/test_v12r5r_zsmalloc_cma_migration.py
          sh -n scripts/collect_ui_perf.sh
          sh -n scripts/collect_ui_trace.sh
          git diff --check

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-Alice-V12R5T-MGLRU-KSU32590-Enf"
          else
            scripts/config --file "$OUT/.config" \
              --enable ALWAYS_PERMISSIVE \
              --enable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-Alice-V12R5T-MGLRU-KSU32590-Perm"
          fi
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate integration
        run: |
          set -ex
          OUT="out-${{ matrix.variant }}"
          grep -E '^(# )?CONFIG_(CMA|DMA_CMA|DEBUG_FS)' "$OUT/.config" || true
          grep -q '^# CONFIG_ANDROID_SIMPLE_LMK is not set$' "$OUT/.config"
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' "$OUT/.config"
          grep -q '^CONFIG_PSI=y$' "$OUT/.config"
          grep -q '^# CONFIG_PSI_DEFAULT_DISABLED is not set$' "$OUT/.config"
          ! grep -q '^CONFIG_CRYPTO_ZSTD=y$' "$OUT/.config"
          grep -q '^CONFIG_MEMCG=y$' "$OUT/.config"
          grep -q '^CONFIG_CMA=y$' "$OUT/.config"
          grep -q '^CONFIG_DMA_CMA=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -q '^CONFIG_ZSMALLOC=y$' "$OUT/.config"
          grep -q '^CONFIG_COMPACTION=y$' "$OUT/.config"
          grep -q '^CONFIG_ZSWAP_MIGRATION_SUPPORT=y$' "$OUT/.config"
          grep -q '^CONFIG_INCREASE_MAXIMUM_SWAPPINESS=y$' "$OUT/.config"
          grep -q '^int vm_swappiness = 160;' mm/vmscan.c
          grep -q '^static int max_swappiness = 200;' kernel/sysctl.c
          ! grep -q '^CONFIG_ZSWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_DEBUG_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_LRU_GEN=y$' "$OUT/.config"
          grep -q '^# CONFIG_LRU_GEN_ENABLED is not set$' "$OUT/.config"
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' "$OUT/.config"
          grep -q '^CONFIG_NR_LRU_GENS=7$' "$OUT/.config"
          grep -q '^CONFIG_TIERS_PER_GEN=4$' "$OUT/.config"
          grep -q '^CONFIG_MALI_HALO_NPU_PARTITION=y$' "$OUT/.config"
          grep -q 'static ssize_t lru_gen_enabled_store' mm/vmscan.c
          grep -q '__ATTR(enabled, 0644, lru_gen_enabled_show, lru_gen_enabled_store)' mm/vmscan.c
          grep -q 'sysfs_create_group(mm_kobj, &lru_gen_attr_group)' mm/vmscan.c
          grep -q 'lru_gen_shrink_lruvec_full' mm/vmscan.c
          grep -q 'lru_gen_get_type_to_scan' mm/vmscan.c
          grep -q 'lru_gen_promote_page_locked' mm/vmscan.c
          grep -q 'lru_gen_scan_around' mm/vmscan.c
          ! grep -q 'lru_gen_scan_around(&pvmw)' mm/rmap.c
          grep -q 'lru_gen_reclaim_batch' mm/vmscan.c
          grep -q '__ATTR(ptwalk, 0644, lru_gen_ptwalk_show, lru_gen_ptwalk_store)' mm/vmscan.c
          grep -q 'lru_gen_age_lruvec_legacy(lruvec, sc, swappiness);' mm/vmscan.c
          grep -q 'psi_trigger_create' kernel/sched/psi.c
          grep -q 'proc_create("pressure/memory"' kernel/sched/psi.c
          grep -q 'psi_memstall_enter' mm/page_alloc.c
          grep -q 'psi_memstall_enter' mm/vmscan.c
          grep -q 'zoneinfo_is_first_populated_zone' mm/vmstat.c
          grep -q 'nr_inactive_file %lu' mm/vmstat.c
          grep -q 'nr_active_file %lu' mm/vmstat.c
          grep -q 'workingset_refault %lu' mm/vmstat.c
          grep -q '^CONFIG_EXYNOS_VPU=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_EXYNOS8895=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_HARDWARE=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_ALC_DEFAULT=y$' "$OUT/.config"
          grep -q '^# CONFIG_EXYNOS_VPU_ALC_HWMAPPER is not set$' "$OUT/.config"
          grep -q 'BUG_ON(incl->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          grep -q 'BUG_ON(otcl->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          grep -q 'BUG_ON(clist->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          ! grep -q 'BUG_ON(!.*index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          ! grep -q 'const const struct vertex_ioctl_ops' drivers/vision/vpu/vpu-vertex.c
          grep -q '^CONFIG_SWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_CPU_UI_HINTS=y$' "$OUT/.config"
          grep -q '^CONFIG_CGROUP_SCHEDTUNE=y$' "$OUT/.config"
          grep -q '^CONFIG_FAIR_GROUP_SCHED=y$' "$OUT/.config"
          grep -q '^CONFIG_F2FS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_EROFS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$OUT/.config"
          grep -q -- '-DKSU_VERSION=32590' drivers/kernelsu/Makefile
          grep -q 'KSU_EXPECTED_SIZE := 0x0363' drivers/kernelsu/Makefile
          grep -q '^unsigned int capacity_margin = 1280;$' kernel/sched/fair.c
          grep -q 'SUGOV_DEFAULT_UP_RATE_LIMIT_US.*(2500)' kernel/sched/cpufreq_schedutil.c
          grep -q 'SUGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(8000)' kernel/sched/cpufreq_schedutil.c
          grep -q 'register_syscore_ops(&s3c2410wdt_syscore_ops)' drivers/watchdog/s3c2410_wdt.c
          ! grep -q 'SIMPLE_DEV_PM_OPS(s3c2410wdt_pm_ops' drivers/watchdog/s3c2410_wdt.c
          grep -q 'kthread_bind_mask(thread, policy->related_cpus)' kernel/sched/cpufreq_schedutil.c
          ! grep -q 'SUGOV_WORKER_CPU' kernel/sched/cpufreq_schedutil.c
          grep -q 'APOLLO_COOLING_RELEASE_TEMP.*64000' drivers/thermal/samsung/exynos_tmu.c
          grep -A2 'mngs_alert0: mngs-alert0' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -A2 'mngs_alert1: mngs-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '70000'
          grep -A2 'apo_alert1: apo-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -q 'cooling-device = <&cpu0 1 1>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'cooling-device = <&cpu0 11 11>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
          fi

      - name: Build kernel and DTB
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v12r5t-mglru-build-log-${{ matrix.variant }}-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: error

      - name: Validate output
        run: |
          OUT="out-${{ matrix.variant }}"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          check_map_symbol() {
            sym="$1"
            if ! grep -q " $sym$" "$OUT/System.map"; then
              echo "::error::Missing System.map symbol: $sym"
              return 1
            fi
          }
          check_image_string() {
            str="$1"
            if ! grep -a -q "$str" "$OUT/arch/arm64/boot/Image"; then
              echo "::error::Missing Image string: $str"
              return 1
            fi
          }
          check_map_symbol zs_page_isolate
          check_map_symbol zs_page_migrate
          check_map_symbol isolate_movable_page
          check_map_symbol page_isolation_get_diag
          check_image_string 'isolation_non_lru_pages_global=%llu'
          check_map_symbol ion_cma_diag_show
          check_map_symbol cma_get_busy_retries
          check_map_symbol cma_get_failed_requests
          check_image_string 'cma_busy_retries_region=%llu'
          check_map_symbol lru_gen_set_state
          check_map_symbol lru_gen_init_lruvec
          check_map_symbol psi_init
          check_map_symbol psi_memstall_enter
          check_map_symbol psi_trigger_create
          check_map_symbol vpu_device_init
          check_map_symbol vpu_system_resume
          # kbase_halo_npu_init_partition() is static and may be inlined by GCC.
          # The config check plus this embedded log string proves the partition
          # code was compiled into the final Image without relying on a static symbol.
          check_image_string 'HALO NPU: Mali partition active'
          if strings -a "$OUT/arch/arm64/boot/Image" | grep -q 'simple_lmk:'; then
            echo "::error::SimpleLMK must not be linked in LMKD+PSI builds"
            exit 1
          fi
          check_image_string 'lru_gen: runtime switch %s begin'
          check_image_string 'lru_gen: runtime switch %s complete'
          strings -a "$OUT/arch/arm64/boot/Image" | grep -x -q '32590'
          grep -q ' sched_cpu_ui_cpu_boost$' "$OUT/System.map"
          grep -q ' sched_cpu_ui_task_boost$' "$OUT/System.map"
          grep -a -q 'ui_hint_prefer_idle' "$OUT/arch/arm64/boot/Image"
          for sym in tracefs_init tracing_init_dentry event_sched_switch \
              event_sched_wakeup event_cpu_frequency event_cpu_idle \
              event_binder_transaction event_binder_transaction_received \
              event_mm_vmscan_direct_reclaim_begin event_mm_vmscan_direct_reclaim_end; do
            grep -q " $sym$" "$OUT/System.map"
          done
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -a -q 'Linux version 4.4.302-Alice-V12R5T-MGLRU-KSU32590-Enf' "$OUT/arch/arm64/boot/Image"
          else
            grep -a -q 'Linux version 4.4.302-Alice-V12R5T-MGLRU-KSU32590-Perm' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package output
        run: |
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          mkdir -p "$DEST"
          cp "$OUT/arch/arm64/boot/Image" "$DEST/"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/"
          cp "$OUT/System.map" "$DEST/"
          cp "$OUT/.config" "$DEST/kernel.config"
          sha256sum "$DEST"/* > "$DEST/SHA256SUMS"

      - name: Upload ${{ matrix.variant }} kernel
        uses: actions/upload-artifact@v4
        with:
          name: dream2lte-v12r5t-mglru-${{ matrix.variant }}-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error

  vendor:
    name: Camera+4G vendor.img (pinned source)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_VENDOR_SHA: a7f28840e03b9c30b744d0a2f55b37d1e729b7c2
    steps:
      - name: Checkout kernel reference (provenance)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned ALICE vendor camera source
        uses: actions/checkout@v4
        with:
          repository: HaloT455/Vendor-45-
          ref: ${{ env.SOURCE_VENDOR_SHA }}
          path: vendor-src
          fetch-depth: 0
          persist-credentials: false

      - name: Pin and preserve both upstream inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C vendor-src rev-parse HEAD)" = "${SOURCE_VENDOR_SHA}"
          test "$(git -C vendor-src rev-parse refs/remotes/origin/baseline/test7)" = d5748652ddf1eb4cdc18d2f51cbbde8f6fd16170
          # Vendor builder will only run from work/*; this is an ephemeral CI branch.
          git -C vendor-src switch -c work/alice-v12r5t-combined-ci
          test -s vendor-src/tools/native_camera/alice_preview_bridge.c
          grep -q 'availablePictureStreamConfigurations' vendor-src/tools/native_camera/alice_preview_bridge.c
          grep -q 'FMT_BLOB 33' vendor-src/tools/native_camera/alice_preview_bridge.c
          echo "Kernel commit: ${GITHUB_SHA}"
          echo "Vendor commit: ${SOURCE_VENDOR_SHA}"

      - name: Install vendor EROFS prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev
          cd vendor-src
          python3 tools/setup_erofs.py

      - name: Verify unmodified Test7 vendor input
        working-directory: vendor-src
        run: |
          python3 tools/test_vendor_config_fixes.py
          python3 tools/build_vendor.py --verify-only --allow-file-changes

      - name: Preserve legacy HAL and stage upstream UN1GAGA wrapper
        working-directory: vendor-src
        run: |
          python3 tools/stage_hlong_camera_wrapper.py --output out/stage_hlong_camera
          python3 tools/integrate_hlong_camera_trial.py \
            --stage out/stage_hlong_camera \
            --report out/camera-integration-trial.json

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Compile native 32/64-bit Samsung Camera preview+picture metadata bridge
        working-directory: vendor-src
        run: |
          python3 tools/build_samsung_preview_bridge.py \
            --ndk "${ANDROID_HOME}/ndk/27.2.12479018" \
            --output out/stage_preview_bridge
          python3 tools/integrate_samsung_preview_bridge_trial.py \
            --stage out/stage_preview_bridge \
            --report out/samsung-preview-bridge-trial.json
          for abi in lib lib64; do
            test -s "vendor/$abi/hw/camera.alice-hlong.universal8895.so"
            test -s "vendor/$abi/hw/camera.vendor.universal8895.so"
            readelf --dyn-syms --wide "vendor/$abi/hw/camera.universal8895.so" | grep -E '[[:space:]]HMI$'
          done

      - name: Add separately traceable LTE RAF fallback overlay
        working-directory: vendor-src
        run: |
          python3 tools/stage_radio_raf_overlay.py \
            --sdk "${ANDROID_HOME}" --output out/ALICE-RadioRAF.apk
          python3 tools/integrate_radio_raf_trial.py \
            --apk out/ALICE-RadioRAF.apk \
            --report out/alice-radio-raf-trial.json

      - name: Build and verify experimental vendor EROFS
        working-directory: vendor-src
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_vendor.py --verify-only --allow-file-changes
          python3 tools/build_vendor.py \
            --allow-file-changes \
            --max-image-bytes 629145600 \
            --output out/vendor.img
          test -s out/vendor.img
          test "$(od -An -tx4 -j1024 -N4 out/vendor.img | tr -d ' ')" = e0f5e1e2
          python3 - <<'PY'
          import hashlib,json,pathlib
          img=pathlib.Path("out/vendor.img")
          r=json.loads(pathlib.Path("out/vendor.report.json").read_text())
          assert r["verified"] and r["entries"]==1435
          assert r["rebuilt_image_sha256"]==hashlib.sha256(img.read_bytes()).hexdigest()
          assert r["rebuilt_image_bytes"]==img.stat().st_size
          print("Verified EROFS and 1435 entries; not device boot-tested")
          PY
          sha256sum out/vendor.img > out/SHA256SUMS

      - name: Upload pinned vendor.img and evidence (not flash verified)
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-V12R5T-CameraVendor-UNTESTED-${{ github.sha }}
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
          path: |
            vendor-src/out/vendor.img
            vendor-src/out/vendor.report.json
            vendor-src/out/SHA256SUMS
            vendor-src/out/camera-integration-trial.json
            vendor-src/out/samsung-preview-bridge-trial.json
            vendor-src/out/alice-radio-raf-trial.json
            vendor-src/out/stage_preview_bridge/build-report.json

  pair:
    name: Verify kernel and vendor build pairing (nonflash)
    needs: [build, vendor]
    runs-on: ubuntu-24.04
    steps:
      - name: Download enforcing kernel build
        uses: actions/download-artifact@v4
        with:
          name: dream2lte-v12r5t-mglru-enforcing-${{ github.sha }}
          path: assembled/kernel-enforcing

      - name: Download permissive kernel build
        uses: actions/download-artifact@v4
        with:
          name: dream2lte-v12r5t-mglru-permissive-${{ github.sha }}
          path: assembled/kernel-permissive

      - name: Download matching Camera vendor build
        uses: actions/download-artifact@v4
        with:
          name: ALICE-V12R5T-CameraVendor-UNTESTED-${{ github.sha }}
          path: assembled/vendor

      - name: Verify hashes and write exact matching source manifest
        env:
          SOURCE_VENDOR_SHA: a7f28840e03b9c30b744d0a2f55b37d1e729b7c2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path("assembled")
          sizes={}
          for variant in ("enforcing","permissive"):
              directory=root/("kernel-"+variant)
              for name in ("Image","dtb.img","System.map","kernel.config"):
                  assert (directory/name).stat().st_size>0, str(directory/name)
          vendor=list(root.rglob("vendor.img"))
          assert len(vendor)==1, f"expected one vendor.img: {vendor}"
          img=vendor[0]
          report=list(root.rglob("vendor.report.json"))
          assert len(report)==1
          details=json.loads(report[0].read_text())
          assert details["verified"] and details["entries"]==1435
          assert details["rebuilt_image_sha256"]==hashlib.sha256(img.read_bytes()).hexdigest()
          files={}
          for f in sorted(root.rglob("*")):
              if f.is_file():
                  rel=f.relative_to(root).as_posix()
                  files[rel]={"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"bytes":f.stat().st_size}
          manifest={
              "device":"Samsung Galaxy S8+ dream2lte SM-G955F Exynos8895",
              "kernel_source":"HaloT455/dream2lte-45",
              "kernel_original_branch":"agent/v12r5t-mglru-aging-stability",
              "kernel_original_commit":"3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3",
              "kernel_ci_commit":os.environ["GITHUB_SHA"],
              "vendor_source":"HaloT455/Vendor-45-",
              "vendor_commit":os.environ["SOURCE_VENDOR_SHA"],
              "kernel_variants":["enforcing","permissive"],
              "vendor_format":"EROFS",
              "files":files,
              "boot_image_created":False,
              "matching_ramdisk_or_boot_footer_checked":False,
              "partition_size_on_physical_device_checked":False,
              "samsung_camera_on_device_tested":False,
              "flash_ready":False
          }
          Path("assembled/PAIR-MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("PAIR PASS: 2 kernels + vendor.img + source pinning. NOT FLASH-READY.")
          PY

      - name: Publish untested combined build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-V12R5T-Kernel-Plus-CameraVendor-PAIR-UNTESTED-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: assembled/
