name: ALice S8Plus Pack Verified boot.img for Test
on:
  push:
    branches:
      - agent/s8plus-energy-aware-kernel-20261122
    paths:
      - boot-input/ALICE_original_ramdisk.cpio.gz
      - boot-input/ALICE_original_ramdisk.zip
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ALice kernel source and ramdisk
        uses: actions/checkout@v4

      - name: Check exact original ALice ramdisk
        run: |
          set -euo pipefail
          if [ -f boot-input/ALICE_original_ramdisk.zip ]; then
            test "$(unzip -Z1 boot-input/ALICE_original_ramdisk.zip)" = "ALICE_original_ramdisk.cpio.gz"
            unzip -p boot-input/ALICE_original_ramdisk.zip ALICE_original_ramdisk.cpio.gz > "$RUNNER_TEMP/ALICE_original_ramdisk.cpio.gz"
          else
            cp boot-input/ALICE_original_ramdisk.cpio.gz "$RUNNER_TEMP/ALICE_original_ramdisk.cpio.gz"
          fi
          echo "0acad424dbd7eb133c8d315fad4e112a3cc1fb8991b5dafcf2949092035466a2  $RUNNER_TEMP/ALICE_original_ramdisk.cpio.gz" | sha256sum -c -

      - name: Fetch precompiled verified energy_aware Image and dtb.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p kernel-out
          gh run download 45043851949 -R "${{ github.repository }}" \
            --name ALice-S8Plus-EnergyAware-Kernel-Image-DTB \
            --dir kernel-out
          test -s kernel-out/Image-energy-aware
          test -s kernel-out/dtb.img
          grep -q "^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYAWARE=y$" kernel-out/energy-aware.config
          grep -q "^CONFIG_KSU=y$" kernel-out/energy-aware.config
          grep -q "^CONFIG_ZRAM_DEF_COMP_LZ4KD=y$" kernel-out/energy-aware.config
          grep -q " cpufreq_gov_energy_aware$" kernel-out/System.map
          (cd kernel-out && sha256sum -c SHA256SUMS)

      - name: Pack exact boot image from user's original ramdisk
        run: |
          set -euo pipefail
          mkdir -p output
          python3 scripts/alice_ci_boot_pack.py \
            --image kernel-out/Image-energy-aware \
            --dtb kernel-out/dtb.img \
            --ramdisk "$RUNNER_TEMP/ALICE_original_ramdisk.cpio.gz" \
            --out output/boot.img
          echo "4173a9b5b4c497070369913369ceabb5682457194343d0e02409f63dc3a3fa08  output/boot.img" | sha256sum -c -
          (cd output && sha256sum boot.img > SHA256SUMS.txt)
          echo 'WARNING: NOT physically boot-tested on Galaxy S8+. Keep original boot and recovery access.' > output/README_TEST_ONLY.txt

      - name: Upload ONE boot.img to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALice_S8Plus_EnergyAware_KSU_LZ4KD_BOOT_TEST
          path: output/
          compression-level: 6
          if-no-files-found: error
