name: ALice S8Plus Repack REAL EnergyAware boot.img (same commit)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact ALice branch commit
        uses: actions/checkout@v4

      - name: Require genuine original boot image
        run: |
          set -euo pipefail
          if [ -f boot-input/ALICE_original_boot.img ] && [ -f boot-input/ALICE_original_boot.zip ]; then
            echo "::error::Provide exactly one original boot input"
            exit 1
          elif [ -f boot-input/ALICE_original_boot.zip ]; then
            test "$(unzip -Z1 boot-input/ALICE_original_boot.zip)" = "boot.img"
            unzip -p boot-input/ALICE_original_boot.zip boot.img > "$RUNNER_TEMP/original-boot.img"
          elif [ -f boot-input/ALICE_original_boot.img ]; then
            cp boot-input/ALICE_original_boot.img "$RUNNER_TEMP/original-boot.img"
          else
            echo "::error::Missing ORIGINAL boot.img from the SAME device/ROM. No synthetic or stale boot is allowed."
            exit 1
          fi
          test -s "$RUNNER_TEMP/original-boot.img"

      - name: Fetch only a verified SAME-COMMIT successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow alice-s8plus-energy-aware-ci.yml \
            --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq '.[0].databaseId' --limit 10)"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful energy-aware kernel build for commit $GITHUB_SHA. Run energy-aware CI first."
            exit 1
          fi
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name ALice-S8Plus-EnergyAware-ONLY-Kernel \
            --dir kernel-out
          (cd kernel-out && sha256sum -c SHA256SUMS)
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYAWARE=y$' kernel-out/energy-aware.config
          grep -Eq ' [a-zA-Z] cpufreq_gov_energy_aware$' kernel-out/System.map
          echo "Source commit: $GITHUB_SHA" > provenance.txt
          echo "Kernel CI run: $RUN_ID" >> provenance.txt

      - name: Pack using original header ramdisk and Samsung footer
        run: |
          set -euo pipefail
          mkdir -p output
          python3 scripts/alice_ci_boot_repack.py \
            --original-boot "$RUNNER_TEMP/original-boot.img" \
            --image kernel-out/Image-energy-aware \
            --dtb kernel-out/dtb.img \
            --out output/boot.img | tee output/build-provenance.txt
          cat provenance.txt >> output/build-provenance.txt
          (cd output && sha256sum boot.img > SHA256SUMS)
          echo "UNTESTED boot; keep recovery and backup of original boot partition." > output/README-TEST-ONLY.txt

      - name: Upload boot test image (no fabricated boot)
        uses: actions/upload-artifact@v4
        with:
          name: ALice-S8Plus-REAL-EnergyAware-BOOT-${{ github.sha }}
          path: output/
          if-no-files-found: error
