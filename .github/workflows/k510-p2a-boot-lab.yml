name: Alice K510 P2A early-boot lab (NOT FLASHABLE)

on:
  push:
    branches: ['research/k510-dream2lte-p2']
    paths:
      - 'research/k510/**'
      - '.github/workflows/k510-p2a-boot-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2a-boot-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout boot-lab scripts
        uses: actions/checkout@v4
      - name: Cross-compiler and static libc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross bc bison flex libssl-dev libelf-dev \
            build-essential device-tree-compiler python3 curl
      - name: Import P1 integrated kernel and measured-memory DTB
        run: |
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
      - name: Linux 5.10.262 ARM64 Image and P2 chosen DTB
        run: |
          set -euxo pipefail
          mkdir -p ci-p2a
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p2a"
          mkdir -p "$OUT"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          grep -q '^CONFIG_BLK_DEV_INITRD=y' "$OUT/.config"
          grep -q '^CONFIG_RD_GZIP=y' "$OUT/.config"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image exynos/exynos8895-dream2lte.dtb 2>&1 | tee ci-p2a/kernel-build.log
          test -s "$OUT/arch/arm64/boot/Image"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /chosen bootargs | tee ci-p2a/chosen.txt
          grep -q 'rdinit=/init' ci-p2a/chosen.txt
          fdtget -l "$DTB" /reserved-memory | sort > ci-p2a/reserved-node-names.txt
          test "$(wc -l < ci-p2a/reserved-node-names.txt)" -eq 12
      - name: Build static ARM64 debug initramfs
        run: |
          set -euxo pipefail
          bash research/k510/p2-make-initramfs.sh "$RUNNER_TEMP/alice-k510/p2a-initramfs" \
            2>&1 | tee ci-p2a/initramfs-build.log
          test -s "$RUNNER_TEMP/alice-k510/p2a-initramfs/initramfs.cpio.gz"
      - name: uniLoader build compatibility experiment, S8 donor target only
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/alice-k510/out-p2a/arch/arm64/boot"
          bash research/k510/p2-build-uniloader-lab.sh \
            "$OUT/Image" "$OUT/dts/exynos/exynos8895-dream2lte.dtb" \
            "$RUNNER_TEMP/alice-k510/p2a-initramfs/initramfs.cpio.gz" \
            "$RUNNER_TEMP/alice-k510/p2a-loader" \
            2>&1 | tee ci-p2a/uniloader-build.log
          test -s "$RUNNER_TEMP/alice-k510/p2a-loader/uniLoader/uniLoader"
          cp "$RUNNER_TEMP/alice-k510/p2a-loader/uniloader-lab-sha256.txt" ci-p2a/checksums.txt
          cat > ci-p2a/DO_NOT_FLASH.txt <<'NOTICE'
          This is a Linux 5.10.262 boot-chain COMPILATION experiment.
          uniLoader was built using the Samsung SM-G950F (dreamlte) board configuration,
          NOT validated for the SM-G955F (dream2lte) bootloader or power management.
          UFS, RAM carveout reuse, S-Boot handoff and recovery route remain unverified.
          DO NOT FLASH or package these research components as boot.img.
          NOTICE
      - name: Upload logs only, never a device boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K510-P2A-BOOT-HANDOFF-BUILD-LOGS-NOT-FLASHABLE
          path: ci-p2a/
          if-no-files-found: warn
          retention-days: 14
