name: Alice K510 P5 V12R5T native Android driver migration audit (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p5-v12r5t-drivers-migration']
    paths:
      - 'research/k510/p5-*.sh'
      - 'research/k510/p5-*.py'
      - '.github/workflows/k510-p5-v12r5t-drivers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install ARM64 cross-toolchain and DT utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler \
            python3 curl
      - name: Fetch exact working V12R5T donor kernel object
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin \
            refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
          echo "$PIN" > V12R5T-SOURCE-COMMIT.txt
      - name: Prepare real Linux 5.10.262 and baseline SM-G955F DTB
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
      - name: Integrate P4 board and native 5.10 Android core drivers
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p5"
          mkdir -p "$OUT" ci-p5
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT" \
            2>&1 | tee ci-p5/pstore.log
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT" \
            2>&1 | tee ci-p5/board.log
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT" \
            2>&1 | tee ci-p5/android-config.log
          cp "$OUT/.config" ci-p5/K510-P5-merged.config
      - name: Audit pinned V12R5T vendor driver source inventory
        run: |
          set -euxo pipefail
          python3 research/k510/p5-audit-v12r5t-drivers.py \
            --donor-repo "$GITHUB_WORKSPACE" \
            --linux-510 "$RUNNER_TEMP/alice-k510/linux-5.10.262" \
            --out ci-p5 | tee ci-p5/source-inventory.log
      - name: Compile Linux 5.10 with kernel-core and board drivers
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p5"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 Image exynos/exynos8895-dream2lte.dtb 2>&1 | tee ci-p5/kernel-build.log
          test -s "$OUT/arch/arm64/boot/Image"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          fdtget -t s "$DTB" /soc@0/serial@10430000 status | grep -qx okay
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          cp "$DTB" ci-p5/exynos8895-dream2lte-P5-compileonly.dtb
          {
            echo "Native Linux 5.10 kernel-core components compiled successfully."
            echo "No Samsung 4.4 camera/Mali/charger/UFS-PHY module has been backported."
            echo "UFS node status remains disabled; no boot proof."
            echo "DO NOT FLASH P5 DTB; no boot.img produced."
          } > ci-p5/README.txt
      - name: Archive migration inventory and compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P5-V12R5T-DRIVER-MIGRATION-COMPILE-ONLY
          path: |
            ci-p5/V12R5T-DRIVER-MIGRATION.csv
            ci-p5/V12R5T-MIGRATION-SUMMARY.json
            ci-p5/source-inventory.log
            ci-p5/android-config.log
            ci-p5/K510-P5-merged.config
            ci-p5/exynos8895-dream2lte-P5-compileonly.dtb
            ci-p5/board.log
            ci-p5/README.txt
          if-no-files-found: warn
          retention-days: 14
