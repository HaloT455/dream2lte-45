name: Build S8P R16 + SIM2 LTE Vendor A-B Paired Source Audit (UNTESTED)
# MGLRU OFF at boot by user request; EnergyStep retained, AI workers disabled.

on:
  workflow_dispatch:
    inputs:
      boot_template_url:
        description: 'Direct HTTPS URL to bootable V12R5T-Enforcing-BOOT.img (optional; SHA pinned)'
        required: false
        type: string
  push:
    branches:
      - agent/v12r69-r16-sim2-lte-ab-20261023

permissions:
  contents: read

concurrency:
  group: v12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [enforcing]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout paired Vendor SIM+Camera Video6 source
        uses: actions/checkout@v4
        with:
          repository: HaloT455/Vendor-45-
          ref: 497b3dba109b1562618dadd459f0b3726df5cde4
          path: paired-vendor
          persist-credentials: false

      - name: Validate cross-repository modem and Camera pairing
        run: |
          python3 scripts/guard_boot_vendor_pair.py --vendor-root paired-vendor --output paired-contract.json
          python3 scripts/test_r16_legacy_ramdisk_guard.py
          python3 paired-vendor/tools/alice_sim2_lte_handoff_probe.py --selftest
          python3 paired-vendor/tools/alice_lte_slot1_policy_trial.py --selftest
          python3 -m py_compile scripts/pack_r16_v12r5t_working_boot.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 wget tar xz-utils ccache unzip mksh
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Restore GCC 14.2 cache
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ~/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu
          key: gcc-14.2.rel1-aarch64-linux-47aeefc02b0ee39f

      - name: Download GCC 14.2
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/gcc.tar.xz" \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo '47aeefc02b0ee39f6d4d1812110952975542d365872a7474b5306924bca4faa1  '"$HOME/tools/gcc.tar.xz" | sha256sum -c -
          tar -xJf "$HOME/tools/gcc.tar.xz" -C "$HOME/tools"

      - name: Restore compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: v12r69-r3-ccache-gcc14.2-${{ runner.os }}-${{ github.sha }}
          restore-keys: v12r69-r3-ccache-gcc14.2-${{ runner.os }}-

      - name: Configure toolchain
        run: |
          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=$HOME/tools/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=root" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=dream2lte-v12-ui1-mglru" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=Mon Aug 31 00:00:00 UTC 2026" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          ccache --max-size=1G

      - name: Restore Android NDK cache
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/tools/android-ndk-r27d
          key: android-ndk-r27d-601246087a682d19

      - name: Download official Android NDK r27d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/tools"
          wget -O "$HOME/tools/android-ndk-r27d.zip" https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          echo '601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  '"$HOME/tools/android-ndk-r27d.zip" | sha256sum -c -
          unzip -q "$HOME/tools/android-ndk-r27d.zip" 'android-ndk-r27d/toolchains/llvm/*' 'android-ndk-r27d/source.properties' -d "$HOME/tools"
          rm "$HOME/tools/android-ndk-r27d.zip"

      - name: Build public-source AIDL V2 Power HAL
        run: |
          python3 scripts/build_alice_powerhal.py \
            --ndk "$HOME/tools/android-ndk-r27d" \
            --out powerhal-out --tools "$HOME/tools/alice-aidl-v13"

      - name: Host scheduler regression checks
        run: |
          python3 scripts/test_cpu_ui_hints.py
          python3 scripts/test_ui_trace.py
          python3 scripts/test_mglru_reclaim_stability.py
          python3 scripts/test_mglru_transition.py
          python3 scripts/test_mglru_accounting_audit.py
          python3 scripts/test_v12r5t_mglru_aging_lmkd.py
          python3 scripts/test_v12r67_oneui_boot_compat.py
          python3 scripts/test_v12r69_mglru_audit.py
          python3 scripts/test_v12r69_energy_step_worker.py
          python3 scripts/test_v12r69_energy_step_runtime.py
          python3 scripts/test_r16_legacy_ramdisk_guard.py
          python3 scripts/test_v12r69_r7_iowait.py
          python3 scripts/test_v12r69_r7_reclaim_throttle.py
          python3 scripts/test_v12r69_energy_step_tunables.py
          python3 scripts/test_v12r69_r5_lru_only.py
          python3 scripts/test_v12r69_r5_energy_step_steps.py
          python3 scripts/test_v12r69_mglru_switch_runtime.py
          python3 scripts/test_v12r69_mglru_reclaim_runtime.py
          python3 scripts/test_v12r69_mglru_pte_runtime.py
          python3 scripts/test_v12r69_psi_runtime.py
          python3 scripts/test_v12r69_r8_psi_idle.py
          python3 scripts/test_v12r69_r9_psi_bootstrap.py
          python3 scripts/test_v12r69_r9_worker_layout.py
          python3 scripts/gen_alice_netboot.py --check
          sh -n alice/netboot/boot.sh
          python3 scripts/test_alice_netboot.py
          python3 scripts/gen_alice_cpu_compat.py --check
          sh -n alice/cpu-compat/boot.sh
          python3 scripts/test_alice_cpu_compat.py
          ALICE_TEST_SHELL=/bin/mksh python3 scripts/test_alice_cpu_compat.py
          python3 scripts/test_v12r69_r14_vmstat.py
          python3 scripts/test_v12r69_r11_qos.py
          python3 scripts/gen_alice_powerhal.py --check
          sh -n alice/powerhal/boot.sh
          python3 scripts/test_alice_powerhal.py
          python3 scripts/test_alice_powerhal_boot.py
          ALICE_TEST_SHELL=/bin/mksh python3 scripts/test_alice_powerhal_boot.py
          python3 scripts/test_v12r69_r8_memory_service.py
          python3 scripts/test_v12r69_r8_gpu_boost.py
          sh -n alice/memory-module/low-swap.sh
          sh -n alice/memory-module/customize.sh
          sh -n alice/memory-module/service.sh
          sh -n alice/memory-module/uninstall.sh
          python3 scripts/test_v12r69_low_swap.py
          python3 scripts/test_v12r69_postboot_guard.py
          sh -n scripts/alice-v12r69-mglru-postboot.sh
          sh -n scripts/alice-v12r69-low-swap.sh
          python3 scripts/test_v12r68_energy_step.py
          python3 scripts/test_v12r5u_mglru_live_generation.py
          python3 scripts/test_v12r5v_mglru_reclaim_guard.py
          python3 scripts/test_v12r5x_gpu_compute_profile.py
          python3 scripts/test_v12r60_alice_kernel.py
          python3 scripts/test_v12r61_alice_boot_control.py
          python3 scripts/test_v12r5p_ion_cma_diag.py
          python3 scripts/test_v12r5q_page_isolation_diag.py
          python3 scripts/test_v12r5r_zsmalloc_cma_migration.py
          sh -n scripts/collect_ui_perf.sh
          bash -n scripts/capture-r7-host.sh
          sh -n scripts/capture-r7-device.sh
          sh -n scripts/collect_ui_trace.sh
          sh -n alice/android-app/app/src/main/assets/alice_lru.sh
          sh -n scripts/alice-v12r69-snapshot.sh
          git diff --check

      - name: Configure ${{ matrix.variant }} kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" exynos8895-dream2lte_defconfig
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            scripts/config --file "$OUT/.config" \
              --disable ALWAYS_PERMISSIVE \
              --disable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-Alice-V12R69-R16-ENERGYSTEP-KSU32590-Enf"
          else
            scripts/config --file "$OUT/.config" \
              --enable ALWAYS_PERMISSIVE \
              --enable SECURITY_SELINUX_DEVELOP \
              --set-str LOCALVERSION "-Alice-V12R69-R16-ENERGYSTEP-KSU32590-Perm"
          fi
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" olddefconfig

      - name: Validate integration
        run: |
          set -ex
          OUT="out-${{ matrix.variant }}"
          grep -E '^(# )?CONFIG_(CMA|DMA_CMA|DEBUG_FS)' "$OUT/.config" || true
          grep -q '^# CONFIG_ANDROID_SIMPLE_LMK is not set$' "$OUT/.config"
          grep -q '^# CONFIG_ANDROID_LOW_MEMORY_KILLER is not set$' "$OUT/.config"
          grep -q '^CONFIG_PSI=y$' "$OUT/.config"
          grep -q '^# CONFIG_PSI_DEFAULT_DISABLED is not set$' "$OUT/.config"
          ! grep -q '^CONFIG_CRYPTO_ZSTD=y$' "$OUT/.config"
          grep -q '^CONFIG_MEMCG=y$' "$OUT/.config"
          grep -q '^CONFIG_CMA=y$' "$OUT/.config"
          grep -q '^CONFIG_DMA_CMA=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -q '^CONFIG_ZSMALLOC=y$' "$OUT/.config"
          grep -q '^CONFIG_COMPACTION=y$' "$OUT/.config"
          grep -q '^CONFIG_ZSWAP_MIGRATION_SUPPORT=y$' "$OUT/.config"
          grep -q '^CONFIG_INCREASE_MAXIMUM_SWAPPINESS=y$' "$OUT/.config"
          grep -q '^int vm_swappiness = 160;' mm/vmscan.c
          grep -q '^static int max_swappiness = 200;' kernel/sysctl.c
          ! grep -q '^CONFIG_ZSWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_DEBUG_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_LRU_GEN=y$' "$OUT/.config"
          grep -q '^# CONFIG_LRU_GEN_ENABLED is not set$' "$OUT/.config"
          grep -q 'v12r67_oneui_early_shell_off_ignored=' mm/vmscan.c
          grep -q 'task_ppid_nr(current) == 1' mm/vmscan.c
          grep -q 'runtime_off_allowed=1' mm/vmscan.c
          grep -q '^# CONFIG_LRU_GEN_STATS is not set$' "$OUT/.config"
          grep -q '^CONFIG_NR_LRU_GENS=7$' "$OUT/.config"
          grep -q '^CONFIG_TIERS_PER_GEN=4$' "$OUT/.config"
          grep -q '^# CONFIG_MALI_HALO_NPU_PARTITION is not set$' "$OUT/.config"
          grep -q '^CONFIG_ALICE_SYSINTEL=y$' "$OUT/.config"
          grep -q 'static ssize_t lru_gen_enabled_store' mm/vmscan.c
          grep -q '__ATTR(enabled, 0644, lru_gen_enabled_show, lru_gen_enabled_store)' mm/vmscan.c
          grep -q 'sysfs_create_group(mm_kobj, &lru_gen_attr_group)' mm/vmscan.c
          grep -q 'lru_gen_shrink_lruvec_full' mm/vmscan.c
          grep -q 'lru_gen_get_type_to_scan' mm/vmscan.c
          grep -q 'lru_gen_promote_page_locked' mm/vmscan.c
          grep -q 'lru_gen_scan_around' mm/vmscan.c
          grep -Fq 'lru_gen_scan_around(&pvmw)' mm/rmap.c
          grep -q 'lru_gen_reclaim_batch' mm/vmscan.c
          grep -q '__ATTR(ptwalk, 0644, lru_gen_ptwalk_show, lru_gen_ptwalk_store)' mm/vmscan.c
          grep -q 'lru_gen_age_lruvec_legacy(lruvec, sc, swappiness);' mm/vmscan.c
          grep -q 'psi_trigger_create' kernel/sched/psi.c
          grep -q 'proc_create("pressure/memory"' kernel/sched/psi.c
          grep -q 'psi_memstall_enter' mm/page_alloc.c
          grep -q 'psi_memstall_enter' mm/vmscan.c
          grep -q 'zoneinfo_is_first_populated_zone' mm/vmstat.c
          grep -q 'nr_inactive_file %lu' mm/vmstat.c
          grep -q 'nr_active_file %lu' mm/vmstat.c
          grep -q 'workingset_refault %lu' mm/vmstat.c
          grep -q '^CONFIG_EXYNOS_VPU=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_EXYNOS8895=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_HARDWARE=y$' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_VPU_ALC_DEFAULT=y$' "$OUT/.config"
          grep -q '^# CONFIG_EXYNOS_VPU_ALC_HWMAPPER is not set$' "$OUT/.config"
          grep -q 'BUG_ON(incl->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          grep -q 'BUG_ON(otcl->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          grep -q 'BUG_ON(clist->index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          ! grep -q 'BUG_ON(!.*index >= VPU_MAX_FRAME);' drivers/vision/vpu/vpu-graph.c
          ! grep -q 'const const struct vertex_ioctl_ops' drivers/vision/vpu/vpu-vertex.c
          grep -q '^CONFIG_SWAP=y$' "$OUT/.config"
          grep -q '^CONFIG_ZRAM=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_DEFAULT_GOV_ENERGYSTEP=y$' "$OUT/.config"
          grep -q '^CONFIG_CPU_FREQ_GOV_ENERGYSTEP=y$' "$OUT/.config"
          ! grep -q 'CONFIG_.*SCHEDUTIL' "$OUT/.config"
          grep -q '^CONFIG_DEFAULT_USE_ENERGY_AWARE=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_TUNE=y$' "$OUT/.config"
          grep -q '^CONFIG_FREQVAR_SCHEDTUNE=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_WALT_DEFAULT=y$' "$OUT/.config"
          grep -q '^CONFIG_SCHED_CPU_UI_HINTS=y$' "$OUT/.config"
          grep -q '^CONFIG_CGROUP_SCHEDTUNE=y$' "$OUT/.config"
          grep -q '^CONFIG_FAIR_GROUP_SCHED=y$' "$OUT/.config"
          grep -q '^CONFIG_F2FS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_EROFS_FS=y$' "$OUT/.config"
          grep -q '^CONFIG_KSU=y$' "$OUT/.config"
          grep -q '^# CONFIG_KSU_STRIP_READPROC_GID is not set$' "$OUT/.config"
          grep -q -- '-DKSU_VERSION=32590' drivers/kernelsu/Makefile
          grep -q 'KSU_EXPECTED_SIZE := 0x0363' drivers/kernelsu/Makefile
          grep -q '^unsigned int capacity_margin = 1152;$' kernel/sched/fair.c
          grep -q 'ESGOV_DEFAULT_UP_RATE_LIMIT_US.*(3000)' kernel/sched/cpufreq_energy_step.c
          grep -q 'ESGOV_DEFAULT_DOWN_RATE_LIMIT_US.*(12000)' kernel/sched/cpufreq_energy_step.c
          grep -q 'register_syscore_ops(&s3c2410wdt_syscore_ops)' drivers/watchdog/s3c2410_wdt.c
          ! grep -q 'SIMPLE_DEV_PM_OPS(s3c2410wdt_pm_ops' drivers/watchdog/s3c2410_wdt.c
          grep -q 'kthread_bind_mask(thread, policy->related_cpus)' kernel/sched/cpufreq_energy_step.c
          ! grep -q 'SUGOV_WORKER_CPU' kernel/sched/cpufreq_energy_step.c
          grep -q 'APOLLO_COOLING_RELEASE_TEMP.*64000' drivers/thermal/samsung/exynos_tmu.c
          grep -A2 'mngs_alert0: mngs-alert0' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -A2 'mngs_alert1: mngs-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '70000'
          grep -A2 'apo_alert1: apo-alert1' arch/arm64/boot/dts/exynos/exynos8895.dtsi | grep -q '65000'
          grep -q 'cooling-device = <&cpu0 1 1>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          grep -q 'cooling-device = <&cpu0 11 11>;' arch/arm64/boot/dts/exynos/exynos8895.dtsi
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -q '^# CONFIG_ALWAYS_PERMISSIVE is not set$' "$OUT/.config"
            grep -q '^# CONFIG_SECURITY_SELINUX_DEVELOP is not set$' "$OUT/.config"
          else
            grep -q '^CONFIG_ALWAYS_PERMISSIVE=y$' "$OUT/.config"
            grep -q '^CONFIG_SECURITY_SELINUX_DEVELOP=y$' "$OUT/.config"
          fi

      - name: Build kernel and DTB
        run: |
          set -o pipefail
          OUT="out-${{ matrix.variant }}"
          make O="$OUT" CC="ccache ${CROSS_COMPILE}gcc" -j"$(nproc)" Image dtb.img 2>&1 | tee "build-${{ matrix.variant }}.log"
          ccache --show-stats

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-V12R69-R16-build-log-${{ github.sha }}
          path: build-${{ matrix.variant }}.log
          if-no-files-found: error

      - name: Validate output
        run: |
          OUT="out-${{ matrix.variant }}"
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dtb.img"
          check_map_symbol() {
            sym="$1"
            if ! grep -q " $sym$" "$OUT/System.map"; then
              echo "::error::Missing System.map symbol: $sym"
              return 1
            fi
          }
          check_image_string() {
            str="$1"
            if ! grep -a -q "$str" "$OUT/arch/arm64/boot/Image"; then
              echo "::error::Missing Image string: $str"
              return 1
            fi
          }
          check_map_symbol zs_page_isolate
          check_map_symbol zs_page_migrate
          check_map_symbol isolate_movable_page
          check_map_symbol page_isolation_get_diag
          check_image_string 'isolation_non_lru_pages_global=%llu'
          check_map_symbol ion_cma_diag_show
          check_map_symbol cma_get_busy_retries
          check_map_symbol cma_get_failed_requests
          check_image_string 'cma_busy_retries_region=%llu'
          check_image_string 'energy_step'
          check_map_symbol cpufreq_gov_energy_step
          if grep -Eq ' (cpufreq_gov_schedutil|sugov_[[:alnum:]_]+)$' "$OUT/System.map"; then
            echo "::error::Schedutil symbols must not be linked"
            exit 1
          fi
          if grep -a -q 'schedutil' "$OUT/arch/arm64/boot/Image"; then
            echo "::error::Schedutil must be absent from the Image"
            exit 1
          fi
          check_map_symbol lru_gen_set_state
          check_map_symbol lru_gen_init_lruvec
          grep -q '^CONFIG_VM_EVENT_COUNTERS=y$' "$OUT/.config"
          check_image_string 'pgscan_kswapd %lu'
          check_image_string 'pgscan_direct %lu'
          check_map_symbol psi_init
          check_map_symbol psi_memstall_enter
          check_map_symbol gpu_dvfs_get_load_boost
          check_map_symbol gpu_dvfs_set_load_boost
          check_image_string gpu_dvfs_load
          check_map_symbol wq_worker_last_func
          check_map_symbol psi_trigger_create
          check_map_symbol alice_sysintel_reclaim
          check_map_symbol alice_sysintel_no_progress
          check_image_string 'mglru_offload=0 mglru_auto_enable=0'
          check_image_string 'manual_vm_policy=0 mglru_boot_default=%d'
          check_image_string 'V12R69 R16 ALICE EAS ENERGY-STEP-COMPAT GPU-BALANCE'
          python3 scripts/verify_alice_netboot_image.py "$OUT/arch/arm64/boot/Image"
          check_map_symbol alice_sysintel_init
          check_map_symbol alice_power_hint_init
          check_map_symbol alice_powerhal_blob_init
          python3 scripts/verify_alice_powerhal_image.py "$OUT/arch/arm64/boot/Image" powerhal-out/android.hardware.power.samsung-service
          check_map_symbol vpu_device_init
          check_map_symbol vpu_system_resume
          if grep -a -q 'HALO compute partition: graphics=%u compute=%u' "$OUT/arch/arm64/boot/Image"; then
            echo "::error::AI compute partition must be absent"
            exit 1
          fi
          if strings -a "$OUT/arch/arm64/boot/Image" | grep -q 'simple_lmk:'; then
            echo "::error::SimpleLMK must not be linked in LMKD+PSI builds"
            exit 1
          fi
          check_image_string 'lru_gen: runtime switch %s by pid=%d comm=%s begin'
          check_image_string 'lru_gen: runtime switch %s complete'
          strings -a "$OUT/arch/arm64/boot/Image" | grep -x -q '32590'
          grep -q ' sched_cpu_ui_cpu_boost$' "$OUT/System.map"
          grep -q ' sched_cpu_ui_task_boost$' "$OUT/System.map"
          grep -a -q 'ui_hint_prefer_idle' "$OUT/arch/arm64/boot/Image"
          for sym in tracefs_init tracing_init_dentry event_sched_switch \
              event_sched_wakeup event_cpu_frequency event_cpu_idle \
              event_binder_transaction event_binder_transaction_received \
              event_mm_vmscan_direct_reclaim_begin event_mm_vmscan_direct_reclaim_end; do
            grep -q " $sym$" "$OUT/System.map"
          done
          if [ "${{ matrix.variant }}" = "enforcing" ]; then
            grep -a -q 'Linux version 4.4.302-Alice-V12R69-R16-ENERGYSTEP-KSU32590-Enf' "$OUT/arch/arm64/boot/Image"
          else
            grep -a -q 'Linux version 4.4.302-Alice-V12R69-R16-ENERGYSTEP-KSU32590-Perm' "$OUT/arch/arm64/boot/Image"
          fi

      - name: Package verified kernel
        run: |
          OUT="out-${{ matrix.variant }}"
          DEST="output-${{ matrix.variant }}"
          mkdir -p "$DEST"
          cp "$OUT/arch/arm64/boot/Image" "$DEST/"
          cp "$OUT/arch/arm64/boot/dtb.img" "$DEST/"
          cp "$OUT/System.map" "$DEST/"
          cp "$OUT/.config" "$DEST/kernel.config"
          cp powerhal-out/metadata.json "$DEST/powerhal-metadata.json"
          cp paired-contract.json "$DEST/paired-contract.json"
          cp paired-vendor/tools/alice_sim2_lte_handoff_probe.py "$DEST/alice_sim2_lte_handoff_probe.py"
          cp powerhal-out/android.hardware.power.samsung-service "$DEST/"
          cd "$DEST"
          python3 - <<'PYZIP'
          from pathlib import Path
          import zipfile
          module=Path('../alice/memory-module')
          with zipfile.ZipFile('ALICE_R16_PSI_LMKD_BALANCE_MODULE.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in ['module.prop','customize.sh','service.sh','uninstall.sh','low-swap.sh']:
                  z.write(module/name,name)
          PYZIP
          sha256sum Image dtb.img System.map kernel.config paired-contract.json alice_sim2_lte_handoff_probe.py powerhal-metadata.json android.hardware.power.samsung-service ALICE_R16_PSI_LMKD_BALANCE_MODULE.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Package boot.img from known-bootable V12R5T boot (optional)
        shell: bash
        env:
          ALICE_BOOT_BASE_URL: ${{ inputs.boot_template_url || secrets.ALICE_BOOT_REFERENCE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ALICE_BOOT_BASE_URL:-}" ]; then
            echo "### V12R5T BOOT TEMPLATE MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "No URL supplied. Kernel Image+DTBH artifact remains available." >> "$GITHUB_STEP_SUMMARY"
            echo "To produce boot.img, use workflow_dispatch boot_template_url or ALICE_BOOT_REFERENCE_URL secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p boot-template-tools
          curl --fail --location --silent --show-error --retry 2 \
            "$ALICE_BOOT_BASE_URL" -o boot-template-tools/V12R5T-Enforcing-BOOT.img
          echo '80c3f368ac934725aa1bae01529646c339ade3b88b656e4f98670ba71a850043  boot-template-tools/V12R5T-Enforcing-BOOT.img' | sha256sum -c -
          python3 scripts/pack_r16_v12r5t_working_boot.py \
            --base boot-template-tools/V12R5T-Enforcing-BOOT.img --selftest
          OUT="output-${{ matrix.variant }}"
          python3 scripts/pack_r16_v12r5t_working_boot.py \
            --base boot-template-tools/V12R5T-Enforcing-BOOT.img \
            --kernel "$OUT/Image" --dt "$OUT/dtb.img" \
            --output "$OUT/boot.img"
          (cd "$OUT" && sha256sum boot.img > boot.img.sha256 && sha256sum -c boot.img.sha256)
          echo "### R16 boot.img packed against SHA-pinned V12R5T base (same original ramdisk)" >> "$GITHUB_STEP_SUMMARY"
          echo "No AVB footer added; NO device boot, 4G+4G or camera confirmation." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiled R16 kernel
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-S8P-A16-R16-SIM2-LTE-AB-KERNEL-UNTESTED-${{ github.sha }}
          path: output-${{ matrix.variant }}/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

      - name: Upload complete experimental boot.img
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-S8P-R16-SIM2-BOOT-UNSIGNED-UNTESTED-${{ github.sha }}
          path: |
            output-${{ matrix.variant }}/boot.img
            output-${{ matrix.variant }}/boot.img.sha256
          if-no-files-found: ignore
          retention-days: 14
