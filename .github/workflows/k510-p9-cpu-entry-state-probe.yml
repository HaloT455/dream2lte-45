name: Alice K510 P9 CPU entry-state probe (UNVERIFIED)

on:
  push:
    branches: ['experimental/k510-p9-cpu-entry-state-probe']
    paths:
      - 'research/k510/p2g-pack-experimental-boot.py'
      - 'research/k510/p2g-r1-pstore.sh'
      - 'research/k510/p2g-r2-layout-audit.py'
      - 'research/k510/p2-adapt-uniloader-dream2lte.sh'
      - 'research/k510/p2f-dtbh-pack.py'
      - 'research/k510/p2-*.sh'
      - 'research/k510/p1-*.sh'
      - 'research/k510/P1D-RMEM.txt'
      - 'research/k510/bootstrap.sh'
      - '.github/workflows/k510-p9-cpu-entry-state-probe.yml'
      - 'research/k510/p9-probe-cpu-entry.py'
      - 'research/k510/p8-instrument-uniloader-handoff.py'
      - 'research/k510/p2-build-uniloader-lab.sh'
      - 'research/k510/p4-apply-v12r5t-board.sh'
      - 'research/k510/p5-enable-android-core.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unverified-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross-build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross bc bison flex libssl-dev libelf-dev build-essential \
            device-tree-compiler python3 curl
      - name: Prepare genuine Linux 5.10.262 with P1/P2 backports
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          make -s -C "$SRC" kernelversion | grep -x '5.10.262'
      - name: Compile Linux 5.10.262 ARM64 kernel and S8+ DTB
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p2g"
          mkdir -p "$OUT" ci-p2g
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          # P7 integrates P4 verified board nodes + P5 Android kernel-core
          # with R3 uniLoader diagnostic; NOT a full V12R5T vendor port.
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          for cfg in ANDROID_BINDER_IPC EROFS_FS F2FS_FS SECURITY_SELINUX SCSI_UFS_EXYNOS; do
            grep -q "^CONFIG_${cfg}=y$" "$OUT/.config"
          done
          for cfg in PSTORE PSTORE_RAM PSTORE_CONSOLE PSTORE_PMSG; do
            grep -q "^CONFIG_${cfg}=y$" "$OUT/.config"
          done
          grep -q '^CONFIG_BLK_DEV_INITRD=y' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_ARM64_COMMON_CLK=y' "$OUT/.config"
          grep -q '^CONFIG_PINCTRL_EXYNOS_ARM64=y' "$OUT/.config"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 Image exynos/exynos8895-dream2lte.dtb 2>&1 | tee ci-p2g/kernel-build.log
          test -s "$OUT/arch/arm64/boot/Image"
          test -s "$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          fdtget -t s "$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb" \
            /chosen bootargs | grep -q 'rdinit=/init'
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          fdtget -t s "$DTB" /soc@0/serial@10430000 status | grep -qx okay
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          fdtget -t s "$DTB" /chosen stdout-path | grep -qx 'serial0:115200n8'
          # P7 is an early-boot diagnostic. Storage stays disabled for safety.
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          fdtget -t x "$DTB" '/reserved-memory/ramoops@92000000' reg | grep -qx '0 92000000 8000'
          test "$(fdtget -t x "$DTB" '/reserved-memory/ramoops@92000000' console-size)" = 4000
          # The R1 physical boot address overlapped a Samsung ESS debug window.
          # R2 will derive a new physical entry from the genuine ARM64 Image header.
          python3 - "$OUT/arch/arm64/boot/Image" <<'PY'
          import pathlib,struct
          d=pathlib.Path(__import__('sys').argv[1]).read_bytes()[:64]
          assert len(d)==64 and d[0x38:0x3c]==b'ARM\x64'
          text_offset,image_size=struct.unpack_from('<QQ',d,8)
          assert text_offset<0x200000
          print(f'ARM64 Image header: text_offset=0x{text_offset:x}; image_size=0x{image_size:x}')
          PY
      - name: Build AArch64 debug initramfs and Samsung DTBH
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/p2-make-initramfs.sh "$DIR/p2g-init"
          python3 research/k510/p2f-dtbh-pack.py \
            "$DIR/out-p2g/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb" \
            "$DIR/p2g-dtbh.img"
          test -s "$DIR/p2g-init/initramfs.cpio.gz"
          test -s "$DIR/p2g-dtbh.img"
      - name: Link SM-G955F uniLoader with REAL Linux 5.10 payload
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          SRC="$DIR/out-p2g/arch/arm64/boot"
          ALICE_K510_P8_COPY_CHECK=1 ALICE_K510_P9_CPU_PROBE=1 bash research/k510/p2-build-uniloader-lab.sh \
            "$SRC/Image" "$SRC/dts/exynos/exynos8895-dream2lte.dtb" \
            "$DIR/p2g-init/initramfs.cpio.gz" "$DIR/p2g-loader" \
            2>&1 | tee ci-p2g/loader-build.log
          test -s "$DIR/p2g-loader/uniLoader/uniLoader"
          grep -q '^CONFIG_SAMSUNG_DREAM2LTE=y' \
            "$DIR/p2g-loader/uniLoader/.config"
          test "$(stat -c %s "$DIR/p2g-loader/uniLoader/uniLoader")" -lt 40000000
          # Loader base 0x87000000, ARM64 Image entry 0x98000000+text_offset
          grep -q '^CONFIG_PAYLOAD_ENTRY=0x98' "$DIR/p2g-loader/uniLoader/.config"
          grep -q '^CONFIG_SIMPLE_FB=y' "$DIR/p2g-loader/uniLoader/.config"
          grep -q 'ALICE_R3_DECON_PROBE' \
            "$DIR/p2g-loader/uniLoader/board/samsung/board-dream2lte.c"
          grep -q 'ALICE_R3_SIMPLEFB_PROBE' \
            "$DIR/p2g-loader/uniLoader/board/samsung/board-dream2lte.c"
          grep -q '.num_devices = ARRAY_SIZE(dream2lte_devices),' \
            "$DIR/p2g-loader/uniLoader/board/samsung/board-dream2lte.c"
          grep -q 'ALICE_R3_STAGE_A_UNILOADER_VISIBLE' \
            "$DIR/p2g-loader/uniLoader/main/main.c"
          grep -q 'ALICE_R3_STAGE_B_KERNEL_HANDOFF' \
            "$DIR/p2g-loader/uniLoader/main/main.c"
          for tag in ALICE_P9_ENTRY_EL_ ALICE_P9_MMU_ ALICE_P9_DAIF_ ALICE_P9_DTB_ALIGN8_ ALICE_P9_STATE_READ_DONE; do
            grep -q "$tag" "$DIR/p2g-loader/uniLoader/arch/aarch64/load-kernel.c"
            strings "$DIR/p2g-loader/uniLoader/uniLoader" | grep -q "$tag"
          done
          for tag in ALICE_P8_COPY_KERNEL_BEGIN ALICE_P8_COPY_KERNEL_DONE ALICE_P8_KERNEL_COPY_VERIFIED ALICE_P8_COPY_RAMDISK_BEGIN ALICE_P8_COPY_RAMDISK_DONE ALICE_P8_RAMDISK_COPY_VERIFIED ALICE_P8_BEFORE_ARM64_BRANCH; do
            grep -q "$tag" "$DIR/p2g-loader/uniLoader/arch/aarch64/load-kernel.c"
            strings "$DIR/p2g-loader/uniLoader/uniLoader" | grep -q "$tag"
          done
          strings "$DIR/p2g-loader/uniLoader/uniLoader" \
            | grep -q 'ALICE_R3_STAGE_A_UNILOADER_VISIBLE'
          strings "$DIR/p2g-loader/uniLoader/uniLoader" \
            | grep -q 'ALICE_R3_STAGE_B_KERNEL_HANDOFF'
          python3 research/k510/p2g-r2-layout-audit.py \
            --image "$SRC/Image" \
            --ramdisk "$DIR/p2g-init/initramfs.cpio.gz" \
            --loader "$DIR/p2g-loader/uniLoader/uniLoader" \
            --config "$DIR/p2g-loader/uniLoader/.config" \
            --manifest research/k510/P1D-RMEM.txt \
            --report ci-p2g/R2-MEMORY-AUDIT.json
      - name: Construct 40MiB EXPERIMENTAL boot.img and verify it
        run: |
          set -euxo pipefail
          DIR="$RUNNER_TEMP/alice-k510"
          python3 research/k510/p2g-pack-experimental-boot.py \
            --loader "$DIR/p2g-loader/uniLoader/uniLoader" \
            --ramdisk "$DIR/p2g-init/initramfs.cpio.gz" \
            --dtbh "$DIR/p2g-dtbh.img" \
            --out ci-p2g/Alice_K510_P9_SM-G955F_CPU_STATE_PROBE.img \
            --report ci-p2g/boot-image-structure.json
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          p=pathlib.Path("ci-p2g/Alice_K510_P9_SM-G955F_CPU_STATE_PROBE.img")
          d=p.read_bytes()
          m=json.load(open("ci-p2g/boot-image-structure.json"))
          assert len(d)==41943040
          assert d[:8]==b'ANDROID!'
          ks,ka,rs,ra,ss,sa,ta,page,ds=struct.unpack_from("<9I",d,8)
          assert (ka,ra,ta,page,ss)==(0x10008000,0x11000000,0x10000100,2048,0)
          assert hashlib.sha256(d).hexdigest()==m["sha256"]
          align=lambda x: (x+page-1)//page*page
          start=page+align(ks)+align(rs)
          assert d[start:start+4]==b'DTBH'
          assert d[start+2048:start+2052]==b'\xd0\x0d\xfe\xed'
          assert d[start+align(ds):start+align(ds)+16]==b'SEANDROIDENFORCE'
          print("Android legacy packing and Samsung DTBH structural tests PASS")
          print("Hardware boot capability is UNPROVEN.")
          PY
          cat > ci-p2g/READ_BEFORE_FLASH.txt <<'NOTICE'
          DANGER: P9 EXPERIMENTAL SM-G955F EXYNOS8895 BOOT IMG.
          Kernel: real Linux 5.10.262 plus P4 board and P5 binder/EROFS/F2FS/SELinux configs.
          P9 combines R3 stage markers with P5 Android-core Kconfig.
          P9 prints before/after kernel and ramdisk copies, confirms head/tail data,
          and prints BEFORE_ARM64_BRANCH immediately before handoff.
          P9 READS CurrentEL, SCTLR MMU/DCACHE/ICACHE, DAIF masks and DTB alignment.
          P9 DOES NOT change MMU, cache, interrupt state or PMIC power rails.
          Physical boot safety and Linux entry remain UNVERIFIED.
          THIS IS NOT A FUNCTIONAL ANDROID ONE UI BOOT; /init ONLY PRINTS A HEARTBEAT.
          UFS PHY/regulators are NOT ported; UFS node remains DISABLED.
          Loader: experimental dream2lte uniLoader, regulator/DECON MMIO unvalidated.
          This is a P2G early-boot research image ONLY, not Android/One UI.
          It is NOT TESTED ON REAL HARDWARE and MAY NOT BOOT / MAY BLACKSCREEN.
          Do NOT flash without confirmed Samsung Download Mode recovery,
          verified BOOT backup and a working method to restore boot.img.
          Image is UNSIGNED; firmware security checks may reject it.
          NO recovery, EFS, modem, userdata or system partitions should be modified.
          WARNING: PSTORE_RAM + ramoops 0x92000000 enabled, only if Linux 5.10 reaches pstore init.
          WARNING: This cannot diagnose hangs prior to pstore initialization.
          R2 relocated ARM64 Linux Image to a 2MiB aligned 0x98000000 base + header text_offset.
          R3: S8 donor DECON trigger write to MMIO 0x12860070 ENABLED; G955F hardware NOT TESTED.
          R3: S-Boot continuous splash framebuffer at 0xCC000000 is used ONLY for debug.
          R3 may blank/overwrite the Samsung boot splash; this is intended diagnostic behavior.
          R3 prints ALICE_R3_STAGE_A_UNILOADER_VISIBLE and ALICE_R3_STAGE_B_KERNEL_HANDOFF.
          R3: PMIC regulator writes remain DISABLED; no charger/Android support.
          Failure to display text does NOT prove uniLoader did not start.
          NOTICE
          sha256sum ci-p2g/Alice_K510_P9_SM-G955F_CPU_STATE_PROBE.img \
            > ci-p2g/SHA256SUMS
      - name: Upload EXPERIMENTAL boot.img (not tested)
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P9-SM-G955F-UNVERIFIED-CPU-STATE
          path: |
            ci-p2g/Alice_K510_P9_SM-G955F_CPU_STATE_PROBE.img
            ci-p2g/boot-image-structure.json
            ci-p2g/READ_BEFORE_FLASH.txt
            ci-p2g/SHA256SUMS
            ci-p2g/R2-MEMORY-AUDIT.json
          if-no-files-found: error
          retention-days: 14
