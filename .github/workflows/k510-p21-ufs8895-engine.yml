name: Alice K510 P21 Exynos8895 UFS PHY UniPro calibration engine full vmlinux link (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p21-ufs8895-calibration-engine']
    paths:
      - 'research/k510/p21-*'
      - 'research/k510/P21-*'
      - '.github/workflows/k510-p21-ufs8895-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-final-kernel-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Validate V12R5T donor revision
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
      - name: Create Linux 5.10.262 full-link test tree
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p21"
          mkdir -p "$OUT" ci-p21
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          bash research/k510/p13-stage-v12r5t-acpm.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p21/pinned-donor.log
          bash research/k510/p14-register-donor-kbuild.sh "$SRC" "$OUT" | tee ci-p21/kbuild.log
          python3 research/k510/p15-bridge-i2c.py "$GITHUB_WORKSPACE" "$SRC" | tee ci-p21/i2c-migrate.log
          bash research/k510/p16-stage-acpm-ipc-lab.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p21/acpm-stage.log
          bash research/k510/p17-import-powermeter.sh "$GITHUB_WORKSPACE" "$SRC" | tee ci-p21/powermeter-stage.log
          bash research/k510/p17-stage-final-link-config.sh "$SRC" "$OUT" | tee ci-p21/link-config-gate.log
          python3 research/k510/p20-port-ufs8895-calibration.py "$GITHUB_WORKSPACE" "$SRC" ci-p21 \
            | tee ci-p21/native-8895-calibration-stage.log
          test "$(python3 -c 'import json; print(json.load(open("ci-p21/p20-calibration-port.json"))["entry_count"])')" = 124
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-calibration.h"
          grep -q '"registered_driver": false' ci-p21/p20-calibration-port.json
          bash research/k510/p21-stage-ufs8895-engine.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p21/p21-engine-stage.log
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.c"
          test -s "$SRC/drivers/scsi/ufs/alice-ufs8895-engine.h"
          grep -qx 'obj-y += alice-ufs8895-engine.o' <(tail -n1 "$SRC/drivers/scsi/ufs/Makefile")
          cp "$OUT/.config" ci-p21/K510-P21.config
          test "$(grep -c '^obj-y += .*\.o$' "$SRC/drivers/soc/samsung/acpm/Makefile")" -eq 3
      - name: Compile Exynos8895 original 124 calibration entries with real AArch64 toolchain
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/alice-ufs8895-calibration.o > ci-p21/8895-calibration-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule' ci-p21/8895-calibration-compile.log | tail -n 45 || true
            tail -n 60 ci-p21/8895-calibration-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-calibration.o" \
            | grep -E ' T alice_ufs8895_get_calibration$'
          echo 'P20_8895_CALIBRATION_C_OBJECT_PASS' | tee ci-p21/calibration-compile-status.txt
      - name: Compile Exynos8895 UFS PHY UniPro interpreter against Linux 5.10
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
              -j4 drivers/scsi/ufs/alice-ufs8895-engine.o \
              > ci-p21/ufs-engine-compile.log 2>&1; then
            test -s "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o"
          else
            rc=$?
            grep -En 'error:|fatal error:|No rule|implicit declaration|incompatible' \
              ci-p21/ufs-engine-compile.log | tail -n 60 || true
            tail -n 80 ci-p21/ufs-engine-compile.log
            exit "$rc"
          fi
          aarch64-linux-gnu-nm "$OUT/drivers/scsi/ufs/alice-ufs8895-engine.o" \
            | grep -E ' T alice_ufs8895_(check_phase|run_phase)
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/regulator/s2mps17_powermeter.o > ci-p21/powermeter-build.log 2>&1; then
            test -s "$OUT/drivers/regulator/s2mps17_powermeter.o"
            echo 'Original Samsung S2MPS17 powermeter compiled (C object only).'
          else
            rc=$?
            grep -En 'fatal error:|error:|No rule|Error [0-9]' ci-p21/powermeter-build.log | tail -n 40 || true
            tail -n 60 ci-p21/powermeter-build.log
            exit "$rc"
          fi
      - name: Build real vmlinux and DTB; fail on any kernel linker error
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 vmlinux exynos/exynos8895-dream2lte.dtb > ci-p21/full-build.log 2>&1; then
            echo 'FULL_VMLINUX_LINK=PASS' | tee ci-p21/build-status.txt
          else
            rc=$?
            echo "FULL_VMLINUX_LINK=FAIL exit=$rc" | tee ci-p21/build-status.txt
            grep -En 'undefined reference|multiple definition|fatal error:|error:|Error [0-9]+|No rule to make target' \
              ci-p21/full-build.log | tail -n 85 || true
            tail -n 90 ci-p21/full-build.log
            exit "$rc"
          fi
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          aarch64-linux-gnu-readelf -h "$OUT/vmlinux" > ci-p21/vmlinux-elf-header.txt
          grep -q 'Machine:.*AArch64' ci-p21/vmlinux-elf-header.txt
          cp "$OUT/System.map" ci-p21/System.map
          for sym in \
            s2mps17_powermeter_init s2mps17_powermeter_deinit \
            acpm_ipc_request_channel acpm_ipc_send_data exynos_acpm_read_reg \
            exynos_acpm_write_reg s2mps17_read_reg s2mps17_write_reg; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P17 FAILED: required interface $sym missing from final System.map" >&2
              exit 50
            }
          done
          grep -Eq ' [Tt] alice_ufs8895_get_calibration$' "$OUT/System.map" || {
            echo 'P21 FAILED: 8895 calibration C data absent from final vmlinux'
            exit 48
          }
          echo 'P20 124/124 original 8895 calibration rows linked, NO HW PROBE' \
            | tee ci-p21/calibration-link-status.txt
          for sym in alice_ufs8895_check_phase alice_ufs8895_run_phase; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P21 FAILED: hardware-gated UFS engine symbol $sym missing"; exit 54;
            }
          done
          echo 'P21 UFS 124-entry engine compiled + final link PASS; no hardware probe' \
            | tee ci-p21/ufs-engine-final-link.txt
          sha256sum "$OUT/vmlinux" "$DTB" > ci-p21/checksums-no-binaries.txt
          {
            echo 'P21: REAL vmlinux final kernel link and AArch64 ELF PASS.'
            echo 'All 7 donor ACPM/PMIC drivers and 124-row Exynos8895 calibration tables plus gated PHY/UniPro interpreter in final vmlinux.'
            echo 'DTB UFS still status=disabled.'
            echo 'NOT RUNTIME VERIFIED. UFS interpreter is unregistered and hardware I/O forbidden by default; no SMC/FMP or PMIC runtime, UFS probe or Android init.'
            echo 'No kernel binaries or boot.img published. NEVER FLASH.'
          } | tee ci-p21/README.txt
      - name: Publish exact compile/link evidence (exclude kernel binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P21-FULL-VMLINUX-GATE-NO-FLASH
          path: ci-p21/
          if-no-files-found: warn
          retention-days: 21
 \
            | tee ci-p21/ufs-engine-elf-symbols.txt
          test "$(wc -l < ci-p21/ufs-engine-elf-symbols.txt)" -eq 2
          if grep -Eq 'platform_driver_register|__platform_driver|of_match_table' \
              research/k510/p21-ufs8895-engine.c; then
            echo 'UNSAFE: P21 source must never register a hardware driver' >&2
            exit 55
          fi
          echo 'P21_UFS_ENGINE_C_OBJECT=PASS; NO HARDWARE PROBE' \
            | tee ci-p21/ufs-engine-compile-status.txt
      - name: Verify real Samsung powermeter C object before full kernel link
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/regulator/s2mps17_powermeter.o > ci-p21/powermeter-build.log 2>&1; then
            test -s "$OUT/drivers/regulator/s2mps17_powermeter.o"
            echo 'Original Samsung S2MPS17 powermeter compiled (C object only).'
          else
            rc=$?
            grep -En 'fatal error:|error:|No rule|Error [0-9]' ci-p21/powermeter-build.log | tail -n 40 || true
            tail -n 60 ci-p21/powermeter-build.log
            exit "$rc"
          fi
      - name: Build real vmlinux and DTB; fail on any kernel linker error
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p21"
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 vmlinux exynos/exynos8895-dream2lte.dtb > ci-p21/full-build.log 2>&1; then
            echo 'FULL_VMLINUX_LINK=PASS' | tee ci-p21/build-status.txt
          else
            rc=$?
            echo "FULL_VMLINUX_LINK=FAIL exit=$rc" | tee ci-p21/build-status.txt
            grep -En 'undefined reference|multiple definition|fatal error:|error:|Error [0-9]+|No rule to make target' \
              ci-p21/full-build.log | tail -n 85 || true
            tail -n 90 ci-p21/full-build.log
            exit "$rc"
          fi
          test -s "$OUT/vmlinux"
          test -s "$OUT/System.map"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          aarch64-linux-gnu-readelf -h "$OUT/vmlinux" > ci-p21/vmlinux-elf-header.txt
          grep -q 'Machine:.*AArch64' ci-p21/vmlinux-elf-header.txt
          cp "$OUT/System.map" ci-p21/System.map
          for sym in \
            s2mps17_powermeter_init s2mps17_powermeter_deinit \
            acpm_ipc_request_channel acpm_ipc_send_data exynos_acpm_read_reg \
            exynos_acpm_write_reg s2mps17_read_reg s2mps17_write_reg; do
            grep -Eq " [Tt] $sym$" "$OUT/System.map" || {
              echo "P17 FAILED: required interface $sym missing from final System.map" >&2
              exit 50
            }
          done
          grep -Eq ' [Tt] alice_ufs8895_get_calibration$' "$OUT/System.map" || {
            echo 'P21 FAILED: 8895 calibration C data absent from final vmlinux'
            exit 48
          }
          echo 'P20 124/124 original 8895 calibration rows linked, NO HW PROBE' \
            | tee ci-p21/calibration-link-status.txt
          sha256sum "$OUT/vmlinux" "$DTB" > ci-p21/checksums-no-binaries.txt
          {
            echo 'P21: REAL vmlinux final kernel link and AArch64 ELF PASS.'
            echo 'All 7 donor ACPM/PMIC drivers and 124-row Exynos8895 calibration C arrays in final vmlinux.'
            echo 'DTB UFS still status=disabled.'
            echo 'NOT RUNTIME VERIFIED. No Exynos8895 PHY MMIO, SMC/FMP, PMIC runtime, UFS probe or Android init.'
            echo 'No kernel binaries or boot.img published. NEVER FLASH.'
          } | tee ci-p21/README.txt
      - name: Publish exact compile/link evidence (exclude kernel binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P21-FULL-VMLINUX-GATE-NO-FLASH
          path: ci-p21/
          if-no-files-found: warn
          retention-days: 21
