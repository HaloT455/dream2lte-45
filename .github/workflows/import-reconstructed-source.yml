name: Import reconstructed dream2lte source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-reconstructed-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and publish source branch
