name: Import reconstructed dream2lte source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-reconstructed-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and publish source branch
        shell: bash
        run: |
          set -euo pipefail
          readonly base_commit=dcdaf6878e7f9497e1d90e25980decfa5d684f74
          readonly target_branch=agent/reconstruct-dream2lte-4.4.302
          readonly delta_archive="$RUNNER_TEMP/dream2lte-reconstruction-delta.tar.gz"

          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git remote add source-base https://github.com/boloaimer/exynos-8895.git
          git fetch --depth=1 source-base "$base_commit"

          git switch --force-create "$target_branch" "$GITHUB_SHA"
          git read-tree --reset -u "$base_commit"

          base64 --decode > "$delta_archive" <<'DREAM2LTE_DELTA'

DREAM2LTE_DELTA

          printf '%s  %s\n' \
            f85670d1b4163b73ba857607363603287c20b1b8259001b75326b9941f0faf90 \
            "$delta_archive" | sha256sum --check -
          tar -xzf "$delta_archive" -C "$GITHUB_WORKSPACE"

          git add --all
          git commit -m "Reconstruct dream2lte 4.4.302 kernel source"
          git push origin "HEAD:refs/heads/$target_branch"
