name: Alice K510 P19 ACPM Speedy + Exynos8895 UFS compatibility audit (NO FLASH)
on:
  push:
    branches: ['experimental/k510-p19-vendor-ufs-api-port']
    paths:
      - 'research/k510/p19-*'
      - 'research/k510/P19-*'
      - '.github/workflows/k510-p19-vendor-ufs-port.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-no-flash:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 Linux 5.10 cross-compiler and DT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Verify exact known-good V12R5T donor revision
        run: |
          set -euxo pipefail
          PIN=3ea6f1b4341c0bd9e0e020567fa334da4a1a24c3
          git fetch --no-tags --depth=1 origin refs/heads/agent/v12r5t-mglru-aging-stability
          test "$(git rev-parse FETCH_HEAD)" = "$PIN"
          git cat-file -e "$PIN^{commit}"
          mkdir -p ci-p19
      - name: Prepare genuine Linux 5.10.262 board DTS, native UFS/PHY
        run: |
          set -euxo pipefail
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p19"
          mkdir -p "$OUT" ci-p19
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
          bash research/k510/p2-prepare-dtb.sh "$SRC"
          test "$(make -s -C "$SRC" kernelversion)" = 5.10.262
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          bash research/k510/p2g-r1-pstore.sh "$SRC" "$OUT"
          bash research/k510/p4-apply-v12r5t-board.sh "$SRC" "$OUT"
          bash research/k510/p5-enable-android-core.sh "$SRC" "$OUT"
          bash research/k510/p12-enable-ufs-power-frameworks.sh "$SRC" "$OUT"
          cp "$OUT/.config" ci-p19/K510-P19-native-5.10.config
          python3 research/k510/p18-audit-hardware.py "$GITHUB_WORKSPACE" "$SRC" ci-p19 \
            | tee ci-p19/audit-console.log
          grep -q '"ready_to_flash": false' ci-p19/p18-hardware-audit.json
          grep -q '"native_5_10_status": "disabled"' ci-p19/p18-hardware-audit.json
      - name: Verify native Linux 5.10 UFS host and PHY actually compile (NOT runtime)
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p19"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 drivers/scsi/ufs/ufs-exynos.o drivers/phy/samsung/phy-samsung-ufs.o \
            exynos/exynos8895-dream2lte.dtb > ci-p19/native-ufs-phy-build.log 2>&1
          test -s "$OUT/drivers/scsi/ufs/ufs-exynos.o"
          test -s "$OUT/drivers/phy/samsung/phy-samsung-ufs.o"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$DTB"
          fdtget -t s "$DTB" /soc@0/ufs@11120000 status | grep -qx disabled
          echo 'NATIVE_5_10_UFS_PHY_COMPILE_PASS; UFS_PHYSICAL_PROBE_DISABLED' \
            | tee ci-p19/native-build-status.txt
      - name: Compile exact donor Samsung 4.4 UFS against Linux 5.10 and classify real API blockers
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/alice-k510/linux-5.10.262"
          OUT="$RUNNER_TEMP/alice-k510/out-p19"
          bash research/k510/p18-stage-original-ufs.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p19/original-vendor-ufs-sha256.log
          bash research/k510/p18-stage-vendor-power-headers.sh "$GITHUB_WORKSPACE" "$SRC" \
            | tee ci-p19/original-power-header-sha256.log
          python3 research/k510/p19-port-ufs-abi.py "$SRC" \
            | tee ci-p19/real-abi-migration.log
          make -s -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j4 prepare scripts > ci-p19/vendor-prepare.log 2>&1
          obj=drivers/scsi/ufs/alice-p18-vendor/ufs-exynos-vendor.o
          # CONFIG_CAL_IF is for the isolated V12R5T header's Linux-side
          # declarations ONLY. It is NOT enabled in runnable Linux 5.10.
          if make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS=-DCONFIG_CAL_IF "$obj" > ci-p19/vendor-ufs-compat.log 2>&1; then
            rc=0
          else
            rc=$?
          fi
          if grep -Eqi 'No rule to make target|No targets specified|No rule to make' ci-p19/vendor-ufs-compat.log; then
            result=HARNESS_ERROR
          elif [ "$rc" -eq 0 ] && [ -s "$OUT/$obj" ]; then
            result=SOURCE_C_COMPILE_PASS_ONLY
          elif grep -Eqi 'fatal error:|(^|:[0-9]+:)([0-9]+:)? error:' ci-p19/vendor-ufs-compat.log; then
            result=VENDOR_4_4_TO_5_10_API_PORT_BLOCKED
          else
            result=UNCLASSIFIED_BUILD_FAILURE
          fi
          printf 'vendor_source\t%s\ncompiler_exit\t%s\nufs_probe_test\tNOT_RUN\nboot_image\tNONE\n' \
            "$result" "$rc" | tee ci-p19/vendor-ufs-result.txt
          grep -En 'fatal error:|error:|No rule to make target' ci-p19/vendor-ufs-compat.log \
            | head -n 45 | tee ci-p19/vendor-ufs-error-head.txt || true
          if [ "$result" = HARNESS_ERROR ] || [ "$result" = UNCLASSIFIED_BUILD_FAILURE ]; then
            echo 'P19 CI infrastructure failed: no truthful vendor API classification.' >&2
            exit 46
          fi
          # An API-port failure is a legitimate, exposed research finding,
          # NEVER a claim of working controller or safe boot.
          echo 'P19 completed static power/PHY audit and genuine vendor C-API compatibility inventory.' \
            | tee ci-p19/README.txt
          echo 'NOT A BOOTABLE KERNEL; NEVER FLASH any P19 output.' >> ci-p19/README.txt
      - name: Publish auditable data only – zero boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALICE-K510-P19-ACPM-UFS-DEPENDENCIES-NO-FLASH
          path: ci-p19/
          if-no-files-found: warn
          retention-days: 21
