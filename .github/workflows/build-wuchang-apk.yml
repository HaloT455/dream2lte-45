name: Build Wuchang Live Wallpaper APK

on:
  push:
    branches:
      - wuchang-live-wallpaper
    paths:
      - 'WuchangLiveWallpaper/**'
      - '.github/workflows/build-wuchang-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WuchangLiveWallpaper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WuchangLiveWallpaper-v1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WuchangLiveWallpaper-APK
          path: WuchangLiveWallpaper/app/build/outputs/apk/debug/WuchangLiveWallpaper-v1-debug.apk
          if-no-files-found: error
