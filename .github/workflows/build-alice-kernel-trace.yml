name: Build ALice Kernel Trace APK

on:
  workflow_dispatch:
  push:
    branches:
      - v8haloT45
    paths:
      - "tools/alice-kernel-trace/**"
      - ".github/workflows/build-alice-kernel-trace.yml"

permissions:
  contents: read

concurrency:
  group: alice-kernel-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up cached Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: tools/alice-kernel-trace
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate and package APK
        run: |
          set -eu
          APK=tools/alice-kernel-trace/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -q "package: name='com.alice.kerneltrace' versionCode='200' versionName='2.0'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          mkdir -p output-apk
          cp "$APK" "output-apk/ALice-Kernel-Trace-2.0-${GITHUB_SHA::8}.apk"
          cp tools/alice-kernel-trace/README.md output-apk/README.md
          (cd output-apk && sha256sum *.apk > SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alice-kernel-trace-2.0-${{ github.sha }}
          path: output-apk/
          if-no-files-found: error
