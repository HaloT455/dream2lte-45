name: Alice K510 P1E integrated Exynos8895 build

on:
  push:
    branches: ['research/k510-dream2lte-p1']
    paths:
      - 'research/k510/P1D-RMEM.txt'
      - 'research/k510/p1-apply-memory.sh'
      - 'research/k510/p1-fix-pll510.sh'
      - 'research/k510/p1-import-clocks.sh'
      - 'research/k510/p1-import-pinctrl.sh'
      - 'research/k510/p1-import-dts.sh'
      - '.github/workflows/k510-p1e-integrated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: ARM64 cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev build-essential device-tree-compiler python3 curl
      - name: Import P1A/P1B/P1C2/P1D on genuine 5.10.262
        run: |
          export K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          bash research/k510/bootstrap.sh --fetch
          SRC="$K510_WORKDIR/linux-5.10.262"
          bash research/k510/p1-import-dts.sh "$SRC"
          bash research/k510/p1-import-pinctrl.sh "$SRC"
          bash research/k510/p1-import-clocks.sh "$SRC"
          bash research/k510/p1-fix-pll510.sh "$SRC"
          bash research/k510/p1-apply-memory.sh "$SRC"
      - name: Build Image and measured-memory dream2lte DTB
        run: |
          set -euxo pipefail
          K510_WORKDIR="$RUNNER_TEMP/alice-k510"
          SRC="$K510_WORKDIR/linux-5.10.262"
          OUT="$K510_WORKDIR/out-p1e"
          mkdir -p "$OUT" ci-p1e
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          grep -q '^CONFIG_PINCTRL_EXYNOS_ARM64=y' "$OUT/.config"
          grep -q '^CONFIG_EXYNOS_ARM64_COMMON_CLK=y' "$OUT/.config"
          make -C "$SRC" O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image exynos/exynos8895-dream2lte.dtb 2>&1 | tee ci-p1e/build.log
          IMG="$OUT/arch/arm64/boot/Image"
          DTB="$OUT/arch/arm64/boot/dts/exynos/exynos8895-dream2lte.dtb"
          test -s "$IMG" && test -s "$DTB"
          test "$(fdtget -l "$DTB" /reserved-memory | wc -l)" -eq 12
          fdtget -t x "$DTB" /memory@80000000 reg > ci-p1e/ram-cells.txt
          grep -q -i '8 80000000 80000000' ci-p1e/ram-cells.txt
          sha256sum "$IMG" "$DTB" > ci-p1e/sha256sums.txt
          cp "$DTB" ci-p1e/dream2lte-P1E-NOT-FLASHABLE.dtb
          printf '%s\n' \
            'Genuine Linux 5.10.262 ARM64 Image + Exynos8895 DTS, pinctrl, clock, PLL and measured memory' \
            'This is compiler validation only; UFS/PMIC/display/bootloader handoff and vendor drivers are NOT validated.' \
            'NEVER flash these build artifacts to the Samsung Galaxy S8+.' \
            > ci-p1e/README-NOT-FLASHABLE.txt
      - name: Upload integrated build evidence (not a boot image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K510-P1E-INTEGRATED-CROSSBUILD-NOT-FLASHABLE
          path: ci-p1e/
          if-no-files-found: warn
          retention-days: 14
