name: Build MGLRU Diag APK

on:
  push:
    branches:
      - agent/v12r5l-mglru-runtime-diagnostics
      - agent/v12r5t-halo-zram-probe
    paths:
      - 'tools/MGLRUDiagApp/**'
      - 'scripts/test_halo_zstd_compute.py'
      - '.github/workflows/build-mglru-diag-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate compute shader and ZSTD frames
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libzstd1
          python3 scripts/test_halo_zstd_compute.py

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDKROOT"
          export PATH="$SDKROOT/cmdline-tools/latest/bin:$SDKROOT/platform-tools:$PATH"
          sdkmanager --version
          if [ ! -d "$SDKROOT/platforms/android-35" ]; then
            yes | sdkmanager "platforms;android-35"
          fi
          if [ ! -d "$SDKROOT/build-tools/35.0.0" ]; then
            yes | sdkmanager "build-tools;35.0.0"
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p tools/MGLRUDiagApp :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp tools/MGLRUDiagApp/app/build/outputs/apk/debug/app-debug.apk \
             MGLRU-Diag-HALO-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGLRU-Diag-HALO-TEST-${{ github.sha }}
          path: MGLRU-Diag-HALO-TEST.apk
          if-no-files-found: error
