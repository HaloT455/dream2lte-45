plugins {
    id "com.android.application"
}

android {
    namespace "com.alice.kerneltrace"
    compileSdk 35

    defaultConfig {
        applicationId "com.alice.kerneltrace"
        minSdk 26
        targetSdk 35
        versionCode 200
        versionName "2.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
