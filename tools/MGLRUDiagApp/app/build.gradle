plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halo.mglrudiag'
    compileSdk 35

    defaultConfig {
        applicationId "com.halo.mglrudiag"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.3-HALO-LOG"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".halolog"
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.7-12@aar'
}
