plugins {
    id 'com.android.application'
}

android {
    namespace 'com.halo.mglrudiag'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.halo.mglrudiag"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.5-HALO-LZ4KD"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".halolz4kd"
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
