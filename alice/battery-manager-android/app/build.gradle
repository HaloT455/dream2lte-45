plugins { id 'com.android.application' }

android {
    namespace 'com.halot455.alice.battery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.halot455.alice.battery'
        minSdk 26
        targetSdk 32
        versionCode 103
        versionName '1.2-ESG2-SystemUI-80-20-TEST'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Xposed classes MUST remain compileOnly: runtime framework provides them.
dependencies { compileOnly files('libs/xposed-api-stubs.jar') }
